[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-security-runtime"
version = "0.1.0"
description = "Local security runtime for AI coding agents"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"
dependencies = ["semgrep==1.178.0", "PyYAML>=6,<7"]

[project.optional-dependencies]
mcp = ["mcp>=1.0,<3"]
test = ["pytest>=8"]

[project.scripts]
security-check = "security_runtime.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
security_runtime = ["rules/LICENSE", "rules/*/*.yml", "licenses/*/LICENSE", "licenses/*/NOTICE"]

[tool.setuptools.data-files]
"share/ai-security-runtime" = ["LICENSE", "EULA.md", "LICENSING.md", "LICENSES/Apache-2.0.txt", "THIRD_PARTY_NOTICES.md", "SOURCE_OFFER.md"]

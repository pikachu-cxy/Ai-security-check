name: Validate installation fix
on:
  push:
    branches: [codex/macos-install-0312-fix]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15, platform: macos-arm64}
          - {os: macos-15-intel, platform: macos-x64}
          - {os: windows-latest, platform: windows-x64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[build-standalone,test]"
      - run: python -m pytest -q tests/test_install_rule_parser.py tests/test_install_efficiency.py tests/test_personal_install.py
      - run: python scripts/build/build_standalone.py
      - run: python scripts/build/package_artifact.py --platform ${{ matrix.platform }}
      - name: Verify executable and connection
        shell: bash
        run: python scripts/release/verify_artifact.py $(find dist/release -type f \( -name '*.zip' -o -name '*.tar.gz' \))
      - uses: actions/upload-artifact@v4
        with:
          name: install-fix-${{ matrix.platform }}
          path: dist/release/*

name: Compliance

on:
  push:
  pull_request:

jobs:
  compliance:
    name: Compliance
    runs-on: ubuntu-latest
    env:
      SECURITY_RUNTIME_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install compliance dependencies without scanner engines
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps -e .
          python -m pip install "PyYAML>=6,<7" "pytest>=8"
      - name: Check engine licenses and delivery policy
        run: |
          security-check licenses
          security-check licenses --check-distribution
      - name: Check notices against reviewed metadata
        run: python scripts/generate_notices.py --check
      - name: Check rule-pack license and provenance
        run: python -m pytest -q tests/test_compliance.py

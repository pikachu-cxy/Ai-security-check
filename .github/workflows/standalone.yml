name: Standalone artifacts

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [feature/runtime-mvp]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'distribution/**'
      - 'tests/test_bootstrap_runtime.py'
      - 'tests/test_macos_installation.py'
      - 'tests/test_macos_artifact_budget.py'
      - 'tests/test_macos_release_refresh.py'
      - 'tests/test_node_host_preflight.py'
      - 'tests/test_release_assets.py'
      - 'pyproject.toml'
      - '.github/workflows/standalone.yml'
      - '.github/workflows/tests.yml'
      - '.github/workflows/release.yml'

permissions:
  contents: read

concurrency:
  group: standalone-${{ github.ref }}-${{ contains(github.event.head_commit.message, '[refresh-macos-v0.3.6]') && github.sha || 'default' }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && !contains(github.event.head_commit.message, '[refresh-macos-v0.3.6]') }}

jobs:
  build:
    name: Standalone artifact (${{ matrix.platform }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, platform: windows-x64}
          - {os: macos-15, platform: macos-arm64}
          - {os: macos-15-intel, platform: macos-x64}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Use runner-owned temporary directory
        shell: bash
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[build-standalone]"
      - run: python scripts/build_standalone.py
      - run: python scripts/package_artifact.py --platform ${{ matrix.platform }}
      - name: Verify native archive, MCP, and first managed scanner preparation
        shell: bash
        run: |
          python scripts/verify_artifact.py --full --osv-fallback --fix-verify --hooks --remediation --codex-integration $(find dist/release -type f \( -name '*.zip' -o -name '*.tar.gz' \))
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/release/*
          if-no-files-found: error
      - name: Retain failed sample verification diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.platform }}
          path: dist/release/*.diagnostics.json
          if-no-files-found: ignore

  refresh-macos-stage:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/runtime-mvp' && contains(github.event.head_commit.message, '[refresh-macos-v0.3.6]')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: release-macos-*
          merge-multiple: true
          path: dist/release
      - name: Check regressions, both native Mac receipts, and original release identities
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: src
          SOURCE_COMMIT: ${{ github.sha }}
        run: python -m scripts.refresh_macos_release prepare --source-commit "$SOURCE_COMMIT"
      - name: Save old assets and exact proposed replacements before any release write
        uses: actions/upload-artifact@v4
        with:
          name: macos-refresh-${{ github.sha }}
          path: dist/macos-refresh/
          if-no-files-found: error
          retention-days: 30

  refresh-macos-publish:
    needs: refresh-macos-stage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: refresh-published-macos-v0.3.6
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: macos-refresh-${{ github.sha }}
          path: dist/macos-refresh
      - name: Replace only approved Mac assets and shared metadata; preserve Windows and tag
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: python -m scripts.refresh_macos_release publish --source-commit "$SOURCE_COMMIT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-refresh-publication-${{ github.sha }}
          path: dist/macos-refresh/publication.json
          if-no-files-found: ignore

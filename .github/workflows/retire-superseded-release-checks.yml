name: Retire superseded release checks
on:
  push:
    branches: [feature/runtime-mvp]
    paths: ['.github/workflows/retire-superseded-release-checks.yml']
permissions:
  actions: write
  contents: read
jobs:
  cancel-owned-superseded-runs:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel only superseded runtime test runs from this release attempt
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: pikachu-cxy/Ai-security-check
        shell: bash
        run: |
          set -euo pipefail
          for run in 40689520859 40691466956; do
            gh api "repos/$GH_REPO/actions/runs/$run" > run.json
            python - <<'PY'
          import json
          value = json.load(open('run.json'))
          assert value['head_branch'] == 'feature/runtime-mvp'
          assert value['head_sha'] in {
              'e52f5f06d5e43f54e8717bbb7579999aa302abe2',
              '151d201ea71755b89cdd90e2ce0984a3006d544a'}
          assert value['name'] == 'Runtime tests'
          PY
            if [ "$(python -c 'import json; print(json.load(open("run.json"))["status"])')" != completed ]; then
              gh api --method POST "repos/$GH_REPO/actions/runs/$run/cancel"
            fi
          done


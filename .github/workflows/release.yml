name: Developer Alpha release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate tag against the single version source
        env:
          PYTHONPATH: src
        run: python -c 'import os; from security_runtime._version import __version__; assert os.environ["GITHUB_REF_NAME"] == "v" + __version__'
  tests:
    needs: version
    uses: ./.github/workflows/tests.yml
  compliance:
    needs: tests
    uses: ./.github/workflows/compliance.yml
  package:
    needs: compliance
    uses: ./.github/workflows/package.yml
  build:
    needs: package
    uses: ./.github/workflows/standalone.yml
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e . jsonschema
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist/release
      - run: python scripts/make_release_metadata.py
      - run: python scripts/update_homebrew_formula.py --manifest dist/release/release-manifest.json
      - run: python scripts/generate_winget_manifest.py --manifest dist/release/release-manifest.json
      - run: python scripts/validate_manager_metadata.py --manifest dist/release/release-manifest.json
      - name: Upload complete release as draft, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json isDraft > release-state.json 2>/dev/null; then
            python -c 'import json; assert json.load(open("release-state.json"))["isDraft"], "Refusing to overwrite a published release"'
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --prerelease --title "AI Security Runtime $GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" dist/release/* distribution/homebrew/Formula/*.rb distribution/winget/*.yaml --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false

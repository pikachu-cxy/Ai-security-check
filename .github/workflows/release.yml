name: Official release

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: [feature/runtime-mvp]
    paths: ['.github/workflows/release.yml']

permissions:
  contents: read

jobs:
  # Reuse completed local regressions and user-confirmed WorkBuddy desktop acceptance.
  # CI covers the new frozen artifacts and Windows-only long-path behavior.
  version:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[release-v0.3.13]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate tag against the single version source
        env:
          PYTHONPATH: src
        run: python -c 'import os; from security_runtime._version import __version__; assert not os.environ["GITHUB_REF"].startswith("refs/tags/") or os.environ["GITHUB_REF_NAME"] == "v" + __version__'
  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, platform: windows-x64}
          - {os: macos-15, platform: macos-arm64}
          - {os: macos-15-intel, platform: macos-x64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      SECURITY_RUNTIME_USAGE_MONITOR_ENABLED: '0'
      SECURITY_RUNTIME_CONFIG: ${{ github.workspace }}/.ci-unused-user-config.toml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[build-standalone,test]"
      - name: Verify Windows long paths not covered by local macOS acceptance
        if: runner.os == 'Windows'
        run: python -m pytest -q tests/test_workbuddy_connector.py::test_windows_deep_workbuddy_home
      - name: Build this platform once
        run: python scripts/build/build_standalone.py
      - run: python scripts/build/package_artifact.py --platform ${{ matrix.platform }}
      - name: Verify frozen package and current host tool surfaces
        shell: bash
        run: python scripts/release/verify_artifact.py $(find dist/release -type f \( -name '*.zip' -o -name '*.tar.gz' \))
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/release/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e . jsonschema
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist/release
      - run: python scripts/release/make_release_metadata.py --focused
      - run: python scripts/release/update_homebrew_formula.py --manifest dist/release/release-manifest.json
      - run: python scripts/release/generate_winget_manifest.py --manifest dist/release/release-manifest.json
      - run: python scripts/maintenance/validate_manager_metadata.py --manifest dist/release/release-manifest.json
      - name: Include pilot installation guide
        run: |
          cp README.zh-CN.md dist/release/INSTALL.zh-CN.md
          cp docs/PILOT_INSTALL_AND_USE.zh-CN.md dist/release/PILOT_INSTALL_AND_USE.zh-CN.md
      - name: Stage platform downloads and bundled acceptance evidence
        run: python scripts/release/prepare_release_assets.py
      - name: Include version-specific release changes
        run: cat distribution/releases/v0.3.13.md >> dist/release-notes.md
      - name: Upload complete release as draft, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG=$(python -c 'from security_runtime._version import __version__; print("v" + __version__)')
          if tag_object=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha' 2>/dev/null); then
            tag_type=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.type')
            if [ "$tag_type" = tag ]; then
              tag_object=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" --jq '.object.sha')
            fi
            test "$tag_object" = "$GITHUB_SHA" || { echo 'Release tag points to another commit'; exit 1; }
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$RELEASE_TAG" -f sha="$GITHUB_SHA"
          fi
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json 2>/dev/null; then
            python -c 'import json; assert json.load(open("release-state.json"))["isDraft"], "Refusing to overwrite a published release"'
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "AI Security Runtime $RELEASE_TAG" --notes-file dist/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" dist/public-release/* --clobber
          gh release edit "$RELEASE_TAG" --notes-file dist/release-notes.md --prerelease=false --draft=false --latest

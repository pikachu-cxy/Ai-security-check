name: Runtime tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
    inputs:
      focused:
        description: Run release-specific regressions instead of the full development suite
        type: boolean
        default: false

jobs:
  tests:
    if: github.workflow == 'Official release' || github.event_name != 'push' || !contains(github.event.head_commit.message, '[release-v0.3.9]')
    name: Runtime tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    env:
      SECURITY_RUNTIME_OFFLINE: '1'
      SECURITY_RUNTIME_CI_NODE_VERSION: '24.16.0'
    steps:
      - uses: actions/checkout@v4
      - name: Use runner-owned temporary directory
        shell: bash
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Pin the supported arithmetic host runtime
        uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          check-latest: false
      - name: Fail early if the pinned Node host is unavailable
        run: python scripts/node_host_preflight.py --expected-version 24.16.0 --output "${{ runner.temp }}/node-host-preflight.json"
      - name: Retain actual Node host prerequisite receipt
        uses: actions/upload-artifact@v4
        with:
          name: node-host-preflight-${{ matrix.os }}
          path: ${{ runner.temp }}/node-host-preflight.json
          if-no-files-found: error
      - name: Install Runtime and test dependencies
        shell: bash
        run: |
          python -m venv --copies "$RUNNER_TEMP/runtime-test-env"
          if [ "$RUNNER_OS" = Windows ]; then
            test_bin="$RUNNER_TEMP/runtime-test-env/Scripts"
            test_python="$test_bin/python.exe"
          else
            test_bin="$RUNNER_TEMP/runtime-test-env/bin"
            test_python="$test_bin/python"
          fi
          "$test_python" -m pip install --upgrade pip
          "$test_python" -m pip install -e ".[test,scanner-test]"
          echo "$test_bin" >> "$GITHUB_PATH"
      - name: Verify offline scanner identity before regressions
        run: python -c "from security_runtime.toolchain import ToolManager, ToolStatus; tool = ToolManager().ensure('semgrep', offline=True); assert tool.status == ToolStatus.READY, tool.detail"
      - name: Check installation and Mac release contracts before the full regression
        env:
          PYTHONUTF8: '0'
        run: python -m pytest -q tests/test_bootstrap_runtime.py tests/test_macos_installation.py tests/test_macos_release_refresh.py tests/test_macos_artifact_budget.py tests/test_node_host_preflight.py tests/test_release_assets.py
      - name: Check monitor startup and process cleanup before the full regression
        run: >-
          python -m pytest -q
          tests/test_monitoring.py
          tests/test_monitoring_http.py
          tests/test_monitoring_one_click.py
          tests/test_diagnostics.py
          --basetemp="${{ runner.temp }}/monitor-preflight"
      - name: Run Runtime tests
        if: inputs.focused != true
        env:
          SECURITY_RUNTIME_HOST_REPORT_DIR: ${{ runner.temp }}/arithmetic-host-evidence
        run: python -m pytest -q tests --basetemp="${{ runner.temp }}/runtime-tests"
      - name: Run focused source evidence and review closeout regressions
        if: inputs.focused == true
        run: >-
          python -m pytest -q
          tests/test_source_redaction.py
          tests/test_local_evidence.py
          tests/test_task_preimages.py
          tests/test_task_preimage_fingerprints.py
          tests/test_task_review_closeout.py
          tests/test_task_review_adaptive_windows.py
          tests/test_task_review_redacted_changes.py
          tests/test_task_review_invariants.py
          tests/test_component_probe.py
          tests/test_dependency_fallback.py
          tests/test_dependency_scan_runtime.py
          tests/test_hook_reply_context.py
          tests/test_hook_user_feedback.py
          tests/test_install_readiness.py
          tests/test_reply_experience.py
          tests/test_scanner_execution_identity.py
          tests/test_tool_resolution.py
          tests/test_distribution.py
          --basetemp="${{ runner.temp }}/focused-release-tests"
      - name: Retain actual arithmetic host execution evidence
        if: always() && inputs.focused != true
        uses: actions/upload-artifact@v4
        with:
          name: arithmetic-host-evidence-${{ matrix.os }}
          path: ${{ runner.temp }}/arithmetic-host-evidence/arithmetic-host-positive.json
          if-no-files-found: error
      - name: First-party rule quality gate
        if: inputs.focused != true
        run: python scripts/test_rules.py
      - name: Product rule and Vue coverage gates
        if: inputs.focused != true
        shell: bash
        run: |
          python scripts/test_python_rule_product.py
          python scripts/test_javascript_rule_product.py
          python scripts/test_vue_rule_product.py

name: Runtime tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

jobs:
  tests:
    name: Runtime tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    env:
      SECURITY_RUNTIME_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Use runner-owned temporary directory
        shell: bash
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,scanner-test]"
      - name: Run Runtime tests
        run: python -m pytest -q --basetemp="${{ runner.temp }}/runtime-tests"
      - name: First-party rule quality gate
        run: python scripts/test_rules.py

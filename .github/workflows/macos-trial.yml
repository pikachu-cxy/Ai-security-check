name: macOS managed installation trial

on:
  workflow_dispatch:
  push:
    branches: [feature/runtime-mvp, codex/macos-managed-trial]
    paths:
      - 'distribution/macos/**'
      - 'src/security_runtime/managed_identity.py'
      - 'src/security_runtime/build_identity.py'
      - 'scripts/build_managed_wheel.py'
      - 'scripts/build_macos_trial_payload.py'
      - 'scripts/verify_macos_trial.py'
      - 'tests/test_managed_wheel_identity.py'
      - 'tests/test_macos_managed_install.py'
      - 'tests/test_macos_trial_payload.py'
      - '.github/workflows/macos-trial.yml'

permissions:
  contents: read

concurrency:
  group: macos-managed-trial-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15, platform: macos-arm64}
          - {os: macos-15-intel, platform: macos-x64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused verification dependencies
        run: python -m pip install -e '.[test]' build
      - name: Check managed delivery boundaries
        run: |
          bash -n distribution/macos/install.sh
          python -m pytest -q tests/test_managed_wheel_identity.py tests/test_macos_managed_install.py tests/test_macos_trial_payload.py tests/test_build_identity.py tests/test_standalone_identity.py
      - name: Build the immutable managed wheel
        run: |
          python -m build --wheel --outdir dist/wheel
          python scripts/build_managed_wheel.py --wheel dist/wheel/*.whl --source-commit "$GITHUB_SHA" --output dist/managed
      - name: Resolve binary dependencies and build offline payload
        run: python scripts/build_macos_trial_payload.py --wheel dist/managed/*.whl --platform "${{ matrix.platform }}"
      - name: Verify both editor installations and repeat installation
        run: |
          python scripts/verify_macos_trial.py \
            --archive "dist/macos-trial/ai-security-runtime-macos-trial-${{ matrix.platform }}.tar.gz" \
            --platform "${{ matrix.platform }}" \
            --output "dist/macos-trial/acceptance-${{ matrix.platform }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: managed-trial-${{ matrix.platform }}
          path: dist/macos-trial/*
          if-no-files-found: error

  publish:
    if: github.ref == 'refs/heads/feature/runtime-mvp'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: managed-trial-*
          merge-multiple: true
          path: dist/macos-trial
      - name: Publish a separate immutable trial release
        env:
          GH_TOKEN: ${{ github.token }}
          TRIAL_TAG: macos-trial-v0.3.9.3
        run: |
          if gh release view "$TRIAL_TAG" --json isDraft > release-state.json 2>/dev/null; then
            python -c 'import json; assert json.load(open("release-state.json"))["isDraft"], "Trial already published; use a new trial tag instead of replacing it"'
          fi
          if tag_object=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TRIAL_TAG" --jq '.object.sha' 2>/dev/null); then
            test "$tag_object" = "$GITHUB_SHA" || { echo 'Trial tag belongs to another commit'; exit 1; }
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TRIAL_TAG" -f sha="$GITHUB_SHA"
          fi
          if ! gh release view "$TRIAL_TAG" >/dev/null 2>&1; then
            gh release create "$TRIAL_TAG" --verify-tag --draft --prerelease \
              --title "macOS 独立环境安装试用 · 0.3.9.3" --notes-file distribution/macos/RELEASE_NOTES.md
          fi
          gh release upload "$TRIAL_TAG" dist/macos-trial/* --clobber
          gh release edit "$TRIAL_TAG" --draft=false --prerelease --latest=false
      - name: Deploy the documentation after the downloads are public
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --ref feature/runtime-mvp

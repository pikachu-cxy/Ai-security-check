name: Product documentation

on:
  push:
    branches: [feature/runtime-mvp]
    paths:
      - 'website/**'
      - 'README.md'
      - 'README.zh-CN.md'
      - '.github/workflows/docs.yml'
      - 'distribution/macos/install.sh'
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
  workflow_run:
    workflows: ['Official release']
    types: [completed]
    branches: [feature/runtime-mvp]

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      trial_ready: ${{ steps.trial-assets.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: website
      - run: npm run docs:build
        working-directory: website
      - name: Include the opt-in macOS trial installer
        run: |
          mkdir -p website/.vitepress/dist/install
          cp distribution/macos/install.sh website/.vitepress/dist/install/macos.sh
      - name: Check that all documented downloads are public
        id: trial-assets
        run: |
          base=https://github.com/pikachu-cxy/Ai-security-check/releases/download/macos-trial-v0.3.10
          native_base=https://github.com/pikachu-cxy/Ai-security-check/releases/download/v0.3.9
          ready=true
          for platform in macos-arm64 macos-x64; do
            for suffix in .tar.gz .tar.gz.sha256; do
              curl --fail --silent --show-error --location --head --connect-timeout 20 --max-time 60 \
                "$base/ai-security-runtime-macos-trial-$platform$suffix" >/dev/null || ready=false
            done
          done
          for archive in windows-x64.zip macos-arm64.tar.gz macos-x64.tar.gz; do
            for suffix in '' .sha256; do
              curl --fail --silent --show-error --location --head --connect-timeout 20 --max-time 60 \
                "$native_base/ai-security-runtime-v0.3.9-$archive$suffix" >/dev/null || ready=false
            done
          done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          if [ "$ready" != true ]; then
            echo 'Documented release assets are not all public yet. Request docs deployment after both releases publish.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/feature/runtime-mvp' && needs.build.outputs.trial_ready == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

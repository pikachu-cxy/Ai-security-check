name: Product documentation

on:
  push:
    branches: [feature/runtime-mvp]
    paths:
      - 'website/**'
      - 'README.md'
      - 'README.zh-CN.md'
      - '.github/workflows/docs.yml'
      - 'distribution/macos/install.sh'
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
  workflow_run:
    workflows: ['Official release', 'Refresh 0.3.12', 'Refresh 0.3.14']
    types: [completed]
    branches: [feature/runtime-mvp]

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') && (github.event_name != 'push' || !contains(github.event.head_commit.message, '[release-v') || contains(github.event.head_commit.message, '[docs-only]'))
    runs-on: ubuntu-latest
    outputs:
      trial_ready: ${{ steps.trial-assets.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: website
      - run: npm run docs:build
        working-directory: website
      - name: Publish the current native macOS installer
        run: |
          mkdir -p website/.vitepress/dist/install
          cp distribution/macos/install.sh website/.vitepress/dist/install/macos.sh
          (cd website/.vitepress/dist/install && sha256sum macos.sh > macos.sh.sha256)
      - name: Check that all documented downloads are public
        id: trial-assets
        run: |
          # Publication metadata is the docs gate. Transient download gateways
          # must not prevent publishing the installer that recovers those errors.
          curl --fail --silent --show-error --retry 2 --connect-timeout 20 --max-time 60 \
            https://api.github.com/repos/pikachu-cxy/Ai-security-check/releases/tags/v0.3.14 > release-public.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          release = json.loads(Path('release-public.json').read_text())
          assert release['tag_name'] == 'v0.3.14' and not release['draft'] and not release['prerelease']
          assets = {a['name']: a for a in release['assets']}
          for platform in ('windows-x64.zip', 'macos-arm64.tar.gz', 'macos-x64.tar.gz'):
              for suffix in ('', '.sha256'):
                  name = 'ai-security-runtime-v0.3.14-' + platform + suffix
                  asset = assets[name]
                  assert asset['state'] == 'uploaded' and asset['size'] > 0
                  assert asset['browser_download_url'] == 'https://github.com/pikachu-cxy/Ai-security-check/releases/download/v0.3.14/' + name
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('ready=true\n')
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/feature/runtime-mvp' && needs.build.outputs.trial_ready == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

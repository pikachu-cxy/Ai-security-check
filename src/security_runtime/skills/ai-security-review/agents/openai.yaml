interface:
  display_name: "AI Security Review"
  short_description: "Check AI edits and report concrete risks with actual coverage"
  default_prompt: "Use $ai-security-review for lightweight checks of this development task's observed edits with AI Security Runtime. Preserve unknown scope and review relevant findings without creating a whole-project baseline. Use whole-project scans only when explicitly requested."
policy:
  allow_implicit_invocation: true

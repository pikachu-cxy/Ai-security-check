rules:
- id: ai-security.go.request-file-read
  languages:
  - go
  severity: WARNING
  message: HTTP input reaches a file read path. Resolve against an allowed root and
    enforce containment before reading.
  mode: taint
  pattern-sources:
  - patterns:
    - pattern-inside: func $HANDLER(..., $REQ *http.Request, ...) { ... }
    - pattern-either:
      - pattern: $REQ.URL.Query().Get(...)
      - pattern: $REQ.FormValue(...)
      - pattern: $REQ.PostFormValue(...)
    exact: true
  pattern-sinks:
  - patterns:
    - pattern: os.ReadFile($PATH)
    - focus-metavariable: $PATH
  - patterns:
    - pattern: ioutil.ReadFile($PATH)
    - focus-metavariable: $PATH
  metadata:
    publisher: AI Security Runtime
    rule_pack: ai-security-core
    rule_version: 1.0.0
    language: go
    category: request-file-read
    cwe:
    - CWE-22
    confidence: MEDIUM
    maturity: BETA
    framework: Go net/http + os
    license: Apache-2.0
    references: &id001
    - https://cwe.mitre.org/data/definitions/22.html
    provenance:
      origin: FIRST_PARTY
      author: AI Security Runtime contributors
      created_at: '2026-10-22'
      references: *id001
      license: Apache-2.0
      derived_from: ''

rules:
- id: ai-security.go.command-injection
  languages:
  - go
  severity: WARNING
  message: HTTP input reaches a shell command string. Use a fixed executable with
    separate arguments and validate the argument contract.
  mode: taint
  pattern-sources:
  - patterns:
    - pattern-inside: func $HANDLER(..., $REQ *http.Request, ...) { ... }
    - pattern-either:
      - pattern: $REQ.URL.Query().Get(...)
      - pattern: $REQ.FormValue(...)
      - pattern: $REQ.PostFormValue(...)
    exact: true
  pattern-sinks:
  - patterns:
    - pattern: exec.Command("sh", "-c", $INPUT, ...)
    - focus-metavariable: $INPUT
  - patterns:
    - pattern: exec.Command("bash", "-c", $INPUT, ...)
    - focus-metavariable: $INPUT
  metadata:
    publisher: AI Security Runtime
    rule_pack: ai-security-core
    rule_version: 1.0.0
    language: go
    category: command-injection
    cwe:
    - CWE-78
    confidence: MEDIUM
    maturity: BETA
    framework: Go net/http + os/exec
    license: Apache-2.0
    references: &id001
    - https://cwe.mitre.org/data/definitions/78.html
    provenance:
      origin: FIRST_PARTY
      author: AI Security Runtime contributors
      created_at: '2026-10-22'
      references: *id001
      license: Apache-2.0
      derived_from: ''

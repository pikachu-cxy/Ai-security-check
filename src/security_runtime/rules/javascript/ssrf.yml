      - pattern: $REQ.params
      - pattern: $REQ.body
      - pattern: $REQ.headers
      - pattern: $REQ.cookies
      - pattern: $REQ.get(...)
    exact: true
  - patterns:
    - pattern-inside: this.$HANDLER = ($REQ, $RES, ...) => { ... }
    - pattern-either:
      - pattern: $REQ.query
      - pattern: $REQ.params
      - pattern: $REQ.body
      - pattern: $REQ.headers
      - pattern: $REQ.cookies
      - pattern: $REQ.get(...)
    exact: true
  - patterns:
    - pattern-inside: this.$HANDLER = async ($REQ, $RES, ...) => { ... }

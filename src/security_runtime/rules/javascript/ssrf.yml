        metavariable: $METHOD
        regex: ^(get|post|put|patch|delete|all|use)$
    - pattern-either:
      - pattern: $REQ.query
      - pattern: $REQ.params
      - pattern: $REQ.body
      - pattern: $REQ.headers
      - pattern: $REQ.cookies
      - pattern: $REQ.get(...)
    exact: true
  - patterns:
    - pattern-inside: $ROUTER.$METHOD(..., async function ($REQ, $RES, ...) { ...
        })

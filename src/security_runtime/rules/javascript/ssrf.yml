rules:
- id: ai-security.javascript.ssrf
  languages:
  - javascript
  - typescript
  severity: ERROR
  message: Request input controls an outbound request target. Verify the destination
    policy, redirects and network reachability; local taint is not an exploitability
    proof.
  mode: taint
  pattern-sources:
  - patterns:
    - pattern-inside: $ROUTER.$METHOD(..., ($REQ, $RES, ...) => { ... })
    - metavariable-regex:
        metavariable: $METHOD
        regex: ^(get|post|put|patch|delete|all|use)$
    - pattern-either:
      - pattern: $REQ.query
      - pattern: $REQ.params
      - pattern: $REQ.body
      - pattern: $REQ.headers
      - pattern: $REQ.cookies
      - pattern: $REQ.get(...)
    exact: true
  - patterns:
    - pattern-inside: $ROUTER.$METHOD(..., async ($REQ, $RES, ...) => { ... })
    - metavariable-regex:
        metavariable: $METHOD
        regex: ^(get|post|put|patch|delete|all|use)$
    - pattern-either:
      - pattern: $REQ.query
      - pattern: $REQ.params
      - pattern: $REQ.body
      - pattern: $REQ.headers
      - pattern: $REQ.cookies
      - pattern: $REQ.get(...)
    exact: true
  - patterns:
    - pattern-inside: $ROUTER.$METHOD(..., function ($REQ, $RES, ...) { ... })

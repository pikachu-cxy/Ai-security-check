    - metavariable-regex:
        metavariable: $MODULE
        regex: ^["']?(?:node:)?https?["']?$
    - pattern: '$LIB.$FUNC({hostname: $URL, ...}, ...)'
    - metavariable-regex:
        metavariable: $FUNC
        regex: ^(get|request)$
    - focus-metavariable: $URL

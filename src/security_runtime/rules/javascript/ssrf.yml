      - pattern: $REQ.query
      - pattern: $REQ.params
      - pattern: $REQ.body
      - pattern: $REQ.headers
      - pattern: $REQ.cookies
      - pattern: $REQ.get(...)
    exact: true
  - patterns:
    - pattern-either:
      - pattern-inside: 'import { Request } from "express"; ...'
      - pattern-inside: 'import type { Request } from "express"; ...'
    - pattern-either:
      - pattern-inside: '($REQ: Request, ...) => { ... }'
      - pattern-inside: 'async ($REQ: Request, ...) => { ... }'
      - pattern-inside: 'function $HANDLER($REQ: Request, ...) { ... }'
      - pattern-inside: 'async function $HANDLER($REQ: Request, ...) { ... }'
    - pattern-either:
      - pattern: $REQ.query
      - pattern: $REQ.params
      - pattern: $REQ.body
      - pattern: $REQ.headers
      - pattern: $REQ.cookies
      - pattern: $REQ.get(...)
    exact: true
  pattern-sinks:
  - patterns:
    - pattern: fetch($URL, ...)
    - focus-metavariable: $URL
  - patterns:
    - pattern-either:
      - pattern-inside: const $LIB = require($MODULE); ...
      - pattern-inside: import * as $LIB from $MODULE; ...
      - pattern-inside: import $LIB from $MODULE; ...
    - metavariable-regex:
        metavariable: $MODULE
        regex: ^["']?(?:node:)?https?["']?$
    - pattern: $LIB.$FUNC($URL, ...)
    - metavariable-regex:
        metavariable: $FUNC
        regex: ^(get|request)$
    - pattern-not: $LIB.$FUNC({ ... }, ...)
    - focus-metavariable: $URL

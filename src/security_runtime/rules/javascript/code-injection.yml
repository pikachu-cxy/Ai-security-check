rules:
- id: ai-security.javascript.code-injection
  languages:
  - javascript
  - typescript
  severity: ERROR
  message: Request input reaches executable JavaScript text. Use a data parser or
    a fixed operation; local taint does not establish complete runtime reachability.
  mode: taint
  options:
    taint_assume_safe_functions: true
  pattern-sources:
  - patterns:
    - pattern-inside: $ROUTER.$METHOD(..., ($REQ, $RES, ...) => { ... })
    - metavariable-regex:
        metavariable: $METHOD
        regex: ^(get|post|put|patch|delete|all|use)$
    - pattern-either:
      - pattern: $REQ.query
      - pattern: $REQ.params
      - pattern: $REQ.body
      - pattern: $REQ.headers
      - pattern: $REQ.cookies
      - pattern: $REQ.get(...)
    exact: true
  - patterns:
    - pattern-inside: $ROUTER.$METHOD(..., async ($REQ, $RES, ...) => { ... })
    - metavariable-regex:
        metavariable: $METHOD
        regex: ^(get|post|put|patch|delete|all|use)$
    - pattern-either:
      - pattern: $REQ.query
      - pattern: $REQ.params
      - pattern: $REQ.body
      - pattern: $REQ.headers
      - pattern: $REQ.cookies
      - pattern: $REQ.get(...)
    exact: true
  - patterns:
    - pattern-inside: $ROUTER.$METHOD(..., function ($REQ, $RES, ...) { ... })
    - metavariable-regex:
        metavariable: $METHOD
        regex: ^(get|post|put|patch|delete|all|use)$
    - pattern-either:
      - pattern: $REQ.query
      - pattern: $REQ.params
      - pattern: $REQ.body
      - pattern: $REQ.headers
      - pattern: $REQ.cookies
      - pattern: $REQ.get(...)
    exact: true
  - patterns:
    - pattern-inside: $ROUTER.$METHOD(..., async function ($REQ, $RES, ...) { ...
        })
    - metavariable-regex:
        metavariable: $METHOD
        regex: ^(get|post|put|patch|delete|all|use)$
    - pattern-either:
      - pattern: $REQ.query
      - pattern: $REQ.params
      - pattern: $REQ.body
      - pattern: $REQ.headers
      - pattern: $REQ.cookies
      - pattern: $REQ.get(...)
    exact: true
  - patterns:
    - pattern-either:
      - pattern-inside: import { Request } from "express"; ...
      - pattern-inside: import type { Request } from "express"; ...
    - pattern-either:
      - pattern-inside: '($REQ: Request, ...) => { ... }'
      - pattern-inside: 'async ($REQ: Request, ...) => { ... }'
      - pattern-inside: 'function $HANDLER($REQ: Request, ...) { ... }'
      - pattern-inside: 'async function $HANDLER($REQ: Request, ...) { ... }'
    - pattern-either:
      - pattern: $REQ.query
      - pattern: $REQ.params
      - pattern: $REQ.body
      - pattern: $REQ.headers
      - pattern: $REQ.cookies
      - pattern: $REQ.get(...)
    exact: true
  - patterns:
    - pattern-inside: this.$HANDLER = ($REQ, $RES, ...) => { ... $RES.$REPLY(...);
        ... }
    - metavariable-regex:
        metavariable: $REPLY
        regex: ^(render|send|json|end|redirect)$
    - pattern-either:
      - pattern: $REQ.query
      - pattern: $REQ.params
      - pattern: $REQ.body
      - pattern: $REQ.headers
      - pattern: $REQ.cookies
      - pattern: $REQ.get(...)
    exact: true
  - patterns:
    - pattern-inside: this.$HANDLER = async ($REQ, $RES, ...) => { ... $RES.$REPLY(...);
        ... }
    - metavariable-regex:
        metavariable: $REPLY
        regex: ^(render|send|json|end|redirect)$
    - pattern-either:
      - pattern: $REQ.query
      - pattern: $REQ.params
      - pattern: $REQ.body
      - pattern: $REQ.headers
      - pattern: $REQ.cookies
      - pattern: $REQ.get(...)
    exact: true
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: eval($CODE)
      - pattern: new Function(..., $CODE)
      - pattern: Function(..., $CODE)
    - focus-metavariable: $CODE
  - patterns:
    - pattern-either:
      - pattern-inside: const $VM = require($MODULE); ...
      - pattern-inside: import * as $VM from $MODULE; ...
      - pattern-inside: import $VM from $MODULE; ...
    - metavariable-regex:
        metavariable: $MODULE
        regex: ^["']?(?:node:)?vm["']?$
    - pattern: $VM.$EXEC($CODE, ...)
    - metavariable-regex:
        metavariable: $EXEC
        regex: ^(runInContext|runInNewContext|runInThisContext|compileFunction)$
    - focus-metavariable: $CODE
  metadata:
    publisher: AI Security Runtime
    rule_pack: ai-security-core
    rule_version: 1.0.0
    language: javascript
    category: code-injection
    cwe:
    - CWE-95
    confidence: MEDIUM
    maturity: BETA
    framework: Express / ECMAScript eval and Function / Node.js vm
    license: Apache-2.0
    references:
    - https://cwe.mitre.org/data/definitions/95.html
    - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/eval
    - https://nodejs.org/api/vm.html
    - https://expressjs.com/en/api/
    provenance:
      origin: FIRST_PARTY
      author: AI Security Runtime contributors
      created_at: '2026-10-22'
      references:
      - https://cwe.mitre.org/data/definitions/95.html
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/eval
      - https://nodejs.org/api/vm.html
      - https://expressjs.com/en/api/
      license: Apache-2.0
      derived_from: ''

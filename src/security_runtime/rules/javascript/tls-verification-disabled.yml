rules:
- id: ai-security.javascript.tls-verification-disabled
  languages:
  - javascript
  - typescript
  severity: WARNING
  message: HTTPS certificate verification is explicitly disabled. Keep rejectUnauthorized
    enabled.
  metadata:
    publisher: AI Security Runtime
    rule_pack: ai-security-core
    rule_version: 1.0.0
    language: javascript
    category: tls-verification-disabled
    cwe:
    - CWE-295
    confidence: MEDIUM
    maturity: BETA
    framework: Node.js HTTPS
    license: Apache-2.0
    references: &id001
    - https://cwe.mitre.org/data/definitions/295.html
    provenance:
      origin: FIRST_PARTY
      author: AI Security Runtime contributors
      created_at: '2026-10-22'
      references: *id001
      license: Apache-2.0
      derived_from: ''
  patterns:
  - pattern-either:
    - pattern-inside: const $HTTPS = require("https"); ...
    - pattern-inside: const $HTTPS = require("node:https"); ...
    - pattern-inside: import * as $HTTPS from "https"; ...
    - pattern-inside: import * as $HTTPS from "node:https"; ...
    - pattern-inside: import $HTTPS from "https"; ...
    - pattern-inside: import $HTTPS from "node:https"; ...
  - pattern-either:
    - pattern: '$HTTPS.request(..., { ..., rejectUnauthorized: false, ... }, ...)'
    - pattern: '$HTTPS.get(..., { ..., rejectUnauthorized: false, ... }, ...)'
    - pattern: 'new $HTTPS.Agent({ ..., rejectUnauthorized: false, ... })'

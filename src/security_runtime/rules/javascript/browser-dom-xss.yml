rules:
- id: ai-security.javascript.browser-dom-xss
  languages:
  - javascript
  - typescript
  severity: WARNING
  message: Location-controlled input reaches an HTML sink. Prefer textContent or a
    reviewed HTML sanitizer appropriate to the context.
  mode: taint
  pattern-sources:
  - pattern: location.hash
    exact: true
  - pattern: location.search
    exact: true
  - pattern: window.location.hash
    exact: true
  - pattern: window.location.search
    exact: true
  pattern-sinks:
  - patterns:
    - pattern: $ELEMENT.innerHTML = $HTML
    - focus-metavariable: $HTML
  - patterns:
    - pattern: $ELEMENT.outerHTML = $HTML
    - focus-metavariable: $HTML
  - patterns:
    - pattern: document.write($HTML)
    - focus-metavariable: $HTML
  metadata:
    publisher: AI Security Runtime
    rule_pack: ai-security-core
    rule_version: 1.0.0
    language: javascript
    category: browser-dom-xss
    cwe:
    - CWE-79
    confidence: MEDIUM
    maturity: BETA
    framework: Browser DOM location to HTML
    license: Apache-2.0
    references: &id001
    - https://cwe.mitre.org/data/definitions/79.html
    provenance:
      origin: FIRST_PARTY
      author: AI Security Runtime contributors
      created_at: '2026-10-22'
      references: *id001
      license: Apache-2.0
      derived_from: ''

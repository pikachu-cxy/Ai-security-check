rules:
- id: ai-security.javascript.command-injection
  languages:
  - javascript
  - typescript
  severity: ERROR
  message: Request input reaches a shell command. Prefer a fixed executable and separate
    arguments without a shell; review the argument contract.
  mode: taint
  pattern-sources:
  - patterns:
    - pattern-inside: $ROUTER.$METHOD(..., ($REQ, $RES, ...) => { ... })
    - metavariable-regex:
        metavariable: $METHOD
        regex: ^(get|post|put|patch|delete|all|use)$
    - pattern-either:
      - pattern: $REQ.query
      - pattern: $REQ.params
      - pattern: $REQ.body
      - pattern: $REQ.headers
      - pattern: $REQ.cookies
      - pattern: $REQ.get(...)
    exact: true
  - patterns:
    - pattern-inside: $ROUTER.$METHOD(..., async ($REQ, $RES, ...) => { ... })

rules:
- id: ai-security.python.path-commonprefix-stat-lookup
  languages: [python]
  severity: WARNING
  message: 文件查找用 commonprefix 比较规范化路径的目录边界；它比较字符前缀，调用方路径可控时可能访问同名前缀的相邻目录。使用 commonpath 或明确的目录归属检查，并核对调用方输入。
  patterns:
  - pattern-either:
    - pattern: os.path.commonprefix([$FULL, $ROOT])
    - pattern: os.path.commonprefix([$ROOT, $FULL])
  - pattern-inside: |
      for $ROOT in ...:
          ...
          $JOINED = os.path.join($ROOT, ...)
          ...
          $ROOT = os.path.realpath($ROOT)
          ...
          try:
              return $FULL, os.stat($FULL)
          except ...:
              ...
  - pattern-either:
    - pattern-inside: |
        if os.path.commonprefix([$FULL, $ROOT]) != $ROOT:
            ...
    - pattern-inside: |
        if os.path.commonprefix([$ROOT, $FULL]) != $ROOT:
            ...
  metadata:
    publisher: AI Security Runtime
    rule_pack: ai-security-core
    rule_version: 1.3.2
    language: python
    category: path-traversal
    cwe: [CWE-22]
    confidence: MEDIUM
    maturity: BETA
    framework: Python filesystem lookup with normalized roots and stat
    license: Apache-2.0
    references:
    - https://docs.python.org/3/library/os.path.html#os.path.commonprefix
    provenance:
      origin: FIRST_PARTY
      author: AI Security Runtime contributors
      created_at: '2026-10-16'
      references:
      - https://docs.python.org/3/library/os.path.html#os.path.commonprefix
      license: Apache-2.0
      derived_from: ''

{
  "rules": [
    {
      "id": "ai-security.java.spring-csrf-disabled",
      "languages": [
        "java"
      ],
      "severity": "ERROR",
      "message": "Spring Security 显式关闭 CSRF 校验",
      "pattern-either": [
        {
          "pattern": "(org.springframework.security.config.annotation.web.builders.HttpSecurity $HTTP).csrf().disable()"
        },
        {
          "pattern": "(org.springframework.security.config.annotation.web.builders.HttpSecurity $HTTP).csrf($CSRF -> $CSRF.disable())"
        }
      ],
      "metadata": {
        "publisher": "AI Security Runtime",
        "rule_pack": "ai-security-core",
        "rule_version": "1.3.0",
        "language": "java",
        "category": "csrf",

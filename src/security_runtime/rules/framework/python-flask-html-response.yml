          ],
          "license": "Apache-2.0",
          "derived_from": ""
        }
      },
      "pattern-propagators": [
        {
          "pattern": "$OUT = $VALUE.split(...)[...]",
          "from": "$VALUE",
          "to": "$OUT"
        },
        {
          "pattern": "$OUT = $VALUE.rsplit(...)[...]",
          "from": "$VALUE",
          "to": "$OUT"
        },
        {
          "pattern": "$OUT = base64.b64encode($VALUE.encode(...))",
          "from": "$VALUE",
          "to": "$OUT"
        },
        {
          "pattern": "$OUT = base64.b64decode($VALUE).decode(...)",
          "from": "$VALUE",
          "to": "$OUT"
        }
      ]
    }
  ]

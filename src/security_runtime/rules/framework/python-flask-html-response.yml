{
  "rules": [
    {
      "id": "ai-security.python.flask-html-response",
      "languages": [
        "python"
      ],
      "severity": "ERROR",
      "message": "Unescaped request data reaches a directly returned Flask HTML string",
      "mode": "taint",
      "options": {
        "taint_assume_safe_functions": true
      },
      "pattern-sources": [
        {
          "pattern": "flask.request.args.get(...)",
          "exact": true
        },
        {
          "pattern": "flask.request.args[...]",
          "exact": true
        },
        {
          "pattern": "flask.request.form.get(...)",
          "exact": true
        },
        {
          "pattern": "flask.request.form[...]",
          "exact": true
        },
        {
          "pattern": "flask.request.values.get(...)",
          "exact": true
        },
        {
          "pattern": "flask.request.get_json(...)",
          "exact": true
        },
        {
          "pattern": "flask.request.get_data(...)",
          "exact": true
        },
        {
          "patterns": [
            {
              "pattern-inside": "def $F($REQUEST, ...):\n    ..."
            },
            {
              "pattern-either": [
                {
                  "pattern": "$REQUEST.GET.get(...)"
                },
                {
                  "pattern": "$REQUEST.POST.get(...)"
                },
                {
                  "pattern": "$REQUEST.GET[...]"
                },
                {
                  "pattern": "$REQUEST.POST[...]"
                }
              ]
            }
          ],
          "exact": true
        },
        {
          "pattern": "flask.request.args.getlist(...)",
          "exact": true
        },
        {
          "pattern": "flask.request.form.getlist(...)",
          "exact": true
        },
        {
          "pattern": "flask.request.values.getlist(...)",
          "exact": true
        },
        {
          "pattern": "flask.request.cookies.get(...)",
          "exact": true
        },
        {
          "pattern": "flask.request.cookies[...]",
          "exact": true
        },
        {
          "pattern": "flask.request.headers.get(...)",
          "exact": true
        },
        {
          "pattern": "flask.request.headers[...]",
          "exact": true
        }
      ],
      "pattern-sinks": [
        {
          "patterns": [
            {
              "pattern-inside": "@$APP.route(...)\ndef $F(...):\n    ..."
            },
            {
              "pattern": "return $HTML"
            },
            {
              "pattern-not": "return {...}"
            },
            {
              "pattern-not": "return [...]"
            },
            {
              "pattern-not": "return ($FIRST, ...)"
            },
            {
              "metavariable-pattern": {
                "metavariable": "$HTML",
                "pattern-either": [
                  {
                    "pattern": "f\"...\""
                  },
                  {
                    "pattern": "\"...\" + $VALUE"
                  },
                  {
                    "pattern": "$VALUE + \"...\""
                  }
                ]
              }
            },
            {
              "focus-metavariable": "$HTML"
            }
          ]
        },
        {
          "patterns": [
            {
              "pattern-inside": "@$APP.route(...)\ndef $F(...):\n    ..."
            },
            {
              "pattern-inside": "$RESPONSE = \"...\"\n..."
            },
            {
              "pattern-not-inside": "$RESPONSE = [...]\n..."
            },
            {
              "pattern-not-inside": "$RESPONSE = {...}\n..."
            },
            {
              "pattern": "$RESPONSE += $HTML\nreturn $RESPONSE"
            },
            {
              "metavariable-pattern": {
                "metavariable": "$HTML",
                "pattern-either": [
                  {
                    "pattern": "f\"...\""
                  },
                  {
                    "pattern": "\"...\" + $VALUE"
                  },
                  {
                    "pattern": "$VALUE + \"...\""
                  }
                ]
              }
            },
            {
              "focus-metavariable": "$HTML"
            }
          ]
        },
        {
          "patterns": [
            {
              "pattern-inside": "@$APP.route(...)\ndef $F(...):\n    ..."
            },
            {
              "pattern": "$RESPONSE = $HTML\nreturn $RESPONSE"
            },
            {
              "pattern-not": "$RESPONSE = {...}\nreturn $RESPONSE"
            },
            {
              "pattern-not": "$RESPONSE = [...]\nreturn $RESPONSE"
            },
            {
              "pattern-not": "$RESPONSE = ($FIRST, ...)\nreturn $RESPONSE"
            },
            {
              "metavariable-pattern": {
                "metavariable": "$HTML",
                "pattern-either": [
                  {
                    "pattern": "f\"...\""
                  },
                  {
                    "pattern": "\"...\" + $VALUE"
                  },
                  {
                    "pattern": "$VALUE + \"...\""
                  }
                ]
              }
            },
            {
              "focus-metavariable": "$HTML"
            }
          ]
        },
        {
          "patterns": [
            {
              "pattern-inside": "@$APP.route(...)\ndef $F(...):\n    ..."
            },
            {
              "pattern": "return $FORMAT.format($HTML, ...)"
            },
            {
              "metavariable-regex": {
                "metavariable": "$FORMAT",
                "regex": "(?s)^[\"'](?:[^{}]|\\{\\{|\\}\\})*\\{(?:\\}|0(?:[!:][^}]*)?\\})"
              }
            },
            {
              "focus-metavariable": "$HTML"
            }
          ]
        },
        {
          "patterns": [
            {
              "pattern-inside": "@$APP.route(...)\ndef $F(...):\n    ..."
            },
            {
              "pattern-inside": "$RESPONSE = \"...\"\n..."
            },
            {
              "pattern-not-inside": "$RESPONSE = [...]\n..."
            },
            {
              "pattern-not-inside": "$RESPONSE = {...}\n..."
            },
            {
              "pattern": "$RESPONSE += $FORMAT.format($HTML, ...)\nreturn $RESPONSE"
            },
            {
              "metavariable-regex": {
                "metavariable": "$FORMAT",
                "regex": "(?s)^[\"'](?:[^{}]|\\{\\{|\\}\\})*\\{(?:\\}|0(?:[!:][^}]*)?\\})"
              }
            },
            {
              "focus-metavariable": "$HTML"
            }
          ]
        },
        {
          "patterns": [
            {
              "pattern-inside": "@$APP.route(...)\ndef $F(...):\n    ..."
            },
            {
              "pattern": "$RESPONSE = $FORMAT.format($HTML, ...)\nreturn $RESPONSE"
            },
            {
              "metavariable-regex": {
                "metavariable": "$FORMAT",
                "regex": "(?s)^[\"'](?:[^{}]|\\{\\{|\\}\\})*\\{(?:\\}|0(?:[!:][^}]*)?\\})"
              }
            },
            {
              "focus-metavariable": "$HTML"
            }
          ]
        },
        {
          "patterns": [
            {
              "pattern-inside": "@$APP.route(...)\ndef $F(...):\n    ..."
            },
            {
              "pattern": "return $FORMAT % $HTML"
            },
            {
              "metavariable-regex": {
                "metavariable": "$FORMAT",
                "regex": "(?s)^[\"'](?:[^%]|%%)*%[sra]"
              }
            },
            {
              "focus-metavariable": "$HTML"
            }
          ]
        },
        {
          "patterns": [
            {
              "pattern-inside": "@$APP.route(...)\ndef $F(...):\n    ..."
            },
            {
              "pattern": "$RESPONSE += $FORMAT % $HTML\nreturn $RESPONSE"
            },
            {
              "pattern-inside": "$RESPONSE = \"...\"\n..."
            },
            {
              "pattern-not-inside": "$RESPONSE = [...]\n..."
            },
            {
              "pattern-not-inside": "$RESPONSE = {...}\n..."
            },
            {
              "metavariable-regex": {
                "metavariable": "$FORMAT",
                "regex": "(?s)^[\"'](?:[^%]|%%)*%[sra]"
              }
            },
            {
              "focus-metavariable": "$HTML"
            }
          ]
        },
        {
          "patterns": [
            {
              "pattern-inside": "@$APP.route(...)\ndef $F(...):\n    ..."
            },
            {
              "pattern": "$RESPONSE = $FORMAT % $HTML\nreturn $RESPONSE"
            },
            {
              "metavariable-regex": {
                "metavariable": "$FORMAT",
                "regex": "(?s)^[\"'](?:[^%]|%%)*%[sra]"
              }
            },
            {
              "focus-metavariable": "$HTML"
            }
          ]
        }
      ],
      "pattern-sanitizers": [
        {
          "pattern": "html.escape(...)",
          "exact": true
        },
        {
          "pattern": "markupsafe.escape(...)",
          "exact": true
        },
        {
          "pattern": "django.utils.html.escape(...)",
          "exact": true
        },
        {
          "pattern": "django.utils.html.conditional_escape(...)",
          "exact": true
        },
        {
          "pattern": "int(...)",
          "exact": true
        },
        {
          "pattern": "float(...)",
          "exact": true
        }
      ],
      "metadata": {
        "publisher": "AI Security Runtime",
        "rule_pack": "ai-security-core",
        "rule_version": "1.0.0",
        "language": "python",
        "category": "xss",
        "cwe": [
          "CWE-79"
        ],
        "confidence": "MEDIUM",
        "maturity": "BETA",
        "framework": "Flask direct formatted-string responses",
        "license": "Apache-2.0",
        "references": [
          "https://cwe.mitre.org/data/definitions/79.html",
          "https://flask.palletsprojects.com/en/stable/quickstart/#about-responses"
        ],
        "provenance": {

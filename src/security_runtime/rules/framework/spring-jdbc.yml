rules:
- id: ai-security.java.spring-jdbc
  languages:
  - java
  severity: ERROR
  message: 动态 SQL 可能绕过参数绑定，请检查输入来源和 SQL 构造。
  mode: taint
  pattern-sources:
  - pattern: (javax.servlet.http.HttpServletRequest $REQUEST).getParameter(...)
    exact: true
  - pattern: (javax.servlet.http.HttpServletRequest $REQUEST).getHeader(...)
    exact: true
  - pattern: (javax.servlet.http.HttpServletRequest $REQUEST).getInputStream(...)
    exact: true
  - pattern: (javax.servlet.http.HttpServletRequest $REQUEST).getReader(...)
    exact: true
  - pattern: (jakarta.servlet.http.HttpServletRequest $REQUEST).getParameter(...)
    exact: true
  - pattern: (jakarta.servlet.http.HttpServletRequest $REQUEST).getHeader(...)
    exact: true
  - pattern: (jakarta.servlet.http.HttpServletRequest $REQUEST).getInputStream(...)
    exact: true
  - pattern: (jakarta.servlet.http.HttpServletRequest $REQUEST).getReader(...)
    exact: true
  - patterns:
    - pattern-inside: $RETURN $METHOD(..., @org.springframework.web.bind.annotation.RequestParam
        $TYPE $INPUT, ...) { ... }
    - focus-metavariable: $INPUT
    exact: true
  - patterns:
    - pattern-inside: $RETURN $METHOD(..., @org.springframework.web.bind.annotation.RequestParam(...)
        $TYPE $INPUT, ...) { ... }
    - focus-metavariable: $INPUT
    exact: true
  - patterns:
    - pattern-inside: $RETURN $METHOD(..., @org.springframework.web.bind.annotation.RequestBody
        $TYPE $INPUT, ...) { ... }
    - focus-metavariable: $INPUT
    exact: true
  - patterns:
    - pattern-inside: $RETURN $METHOD(..., @org.springframework.web.bind.annotation.RequestBody(...)
        $TYPE $INPUT, ...) { ... }
    - focus-metavariable: $INPUT
    exact: true
  - patterns:
    - pattern-inside: $RETURN $METHOD(..., @org.springframework.web.bind.annotation.PathVariable
        $TYPE $INPUT, ...) { ... }
    - focus-metavariable: $INPUT
    exact: true
  - patterns:
    - pattern-inside: $RETURN $METHOD(..., @org.springframework.web.bind.annotation.PathVariable(...)
        $TYPE $INPUT, ...) { ... }
    - focus-metavariable: $INPUT
    exact: true
  pattern-sinks:
  - patterns:
    - pattern: (org.springframework.jdbc.core.JdbcTemplate $JDBC).execute($SQL, ...)
    - focus-metavariable: $SQL
  - patterns:
    - pattern: (org.springframework.jdbc.core.JdbcTemplate $JDBC).query($SQL, ...)
    - focus-metavariable: $SQL
  - patterns:
    - pattern: (org.springframework.jdbc.core.JdbcTemplate $JDBC).queryForList($SQL,
        ...)
    - focus-metavariable: $SQL
  - patterns:
    - pattern: (org.springframework.jdbc.core.JdbcTemplate $JDBC).queryForObject($SQL,
        ...)
    - focus-metavariable: $SQL
  - patterns:
    - pattern: (org.springframework.jdbc.core.JdbcTemplate $JDBC).update($SQL, ...)
    - focus-metavariable: $SQL
  metadata:
    publisher: AI Security Runtime
    rule_pack: ai-security-core
    rule_version: 1.1.0
    language: java
    category: sql-injection
    cwe:
    - CWE-89
    confidence: HIGH
    maturity: BETA
    framework: Spring
    license: Apache-2.0
    references: &id001
    - https://cwe.mitre.org/data/definitions/89.html
    provenance:
      origin: FIRST_PARTY
      author: AI Security Runtime contributors
      created_at: '2026-10-01'
      references: *id001
      license: Apache-2.0
      derived_from: ''

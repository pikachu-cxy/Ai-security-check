rules:
- id: ai-security.java.apache-httpclient
  languages:
  - java
  severity: ERROR
  message: Externally influenced HTTP destination reaches request execution; validate destination policy before
    sending.
  mode: taint
  pattern-sources:
  - pattern: (javax.servlet.http.HttpServletRequest $REQUEST).getParameter(...)
    exact: true
    label: REQUEST_INPUT
  - pattern: (javax.servlet.http.HttpServletRequest $REQUEST).getHeader(...)
    exact: true
    label: REQUEST_INPUT
  - pattern: (javax.servlet.http.HttpServletRequest $REQUEST).getInputStream(...)
    exact: true
    label: REQUEST_INPUT
  - pattern: (javax.servlet.http.HttpServletRequest $REQUEST).getReader(...)
    exact: true
    label: REQUEST_INPUT
  - pattern: (jakarta.servlet.http.HttpServletRequest $REQUEST).getParameter(...)
    exact: true
    label: REQUEST_INPUT
  - pattern: (jakarta.servlet.http.HttpServletRequest $REQUEST).getHeader(...)
    exact: true
    label: REQUEST_INPUT
  - pattern: (jakarta.servlet.http.HttpServletRequest $REQUEST).getInputStream(...)
    exact: true
    label: REQUEST_INPUT
  - pattern: (jakarta.servlet.http.HttpServletRequest $REQUEST).getReader(...)
    exact: true
    label: REQUEST_INPUT
  - patterns:
    - pattern-inside: $RETURN $METHOD(..., @org.springframework.web.bind.annotation.RequestParam $TYPE $INPUT, ...)
        { ... }
    - focus-metavariable: $INPUT
    exact: true
    label: REQUEST_INPUT
  - patterns:
    - pattern-inside: $RETURN $METHOD(..., @org.springframework.web.bind.annotation.RequestParam(...) $TYPE $INPUT,
        ...) { ... }
    - focus-metavariable: $INPUT
    exact: true
    label: REQUEST_INPUT
  - patterns:
    - pattern-inside: $RETURN $METHOD(..., @org.springframework.web.bind.annotation.RequestBody $TYPE $INPUT, ...)
        { ... }
    - focus-metavariable: $INPUT
    exact: true
    label: REQUEST_INPUT
  - patterns:
    - pattern-inside: $RETURN $METHOD(..., @org.springframework.web.bind.annotation.RequestBody(...) $TYPE $INPUT,
        ...) { ... }
    - focus-metavariable: $INPUT
    exact: true
    label: REQUEST_INPUT
  - patterns:
    - pattern-inside: $RETURN $METHOD(..., @org.springframework.web.bind.annotation.PathVariable $TYPE $INPUT, ...)
        { ... }
    - focus-metavariable: $INPUT
    exact: true
    label: REQUEST_INPUT
  - patterns:
    - pattern-inside: $RETURN $METHOD(..., @org.springframework.web.bind.annotation.PathVariable(...) $TYPE $INPUT,
        ...) { ... }
    - focus-metavariable: $INPUT
    exact: true
    label: REQUEST_INPUT
  - pattern: new org.apache.http.client.methods.HttpGet($URL)
    requires: REQUEST_INPUT
    label: HTTP_DESTINATION
    exact: true
  - pattern: new org.apache.http.client.methods.HttpPost($URL)
    requires: REQUEST_INPUT
    label: HTTP_DESTINATION
    exact: true
  - pattern: new org.apache.hc.client5.http.classic.methods.HttpGet($URL)
    requires: REQUEST_INPUT
    label: HTTP_DESTINATION
    exact: true
  - pattern: new org.apache.hc.client5.http.classic.methods.HttpPost($URL)
    requires: REQUEST_INPUT
    label: HTTP_DESTINATION
    exact: true
  pattern-sinks:
  - patterns:
    - pattern: (org.apache.http.client.HttpClient $CLIENT).execute(new org.apache.http.client.methods.HttpGet($URL),
        ...)
    - focus-metavariable: $URL
    requires: REQUEST_INPUT
  - patterns:
    - pattern: (org.apache.http.impl.client.CloseableHttpClient $CLIENT).execute(new org.apache.http.client.methods.HttpGet($URL),
        ...)
    - focus-metavariable: $URL
    requires: REQUEST_INPUT
  - patterns:
    - pattern: (org.apache.http.client.HttpClient $CLIENT).execute(new org.apache.http.client.methods.HttpPost($URL),
        ...)
    - focus-metavariable: $URL
    requires: REQUEST_INPUT
  - patterns:
    - pattern: (org.apache.http.impl.client.CloseableHttpClient $CLIENT).execute(new org.apache.http.client.methods.HttpPost($URL),
        ...)
    - focus-metavariable: $URL
    requires: REQUEST_INPUT
  - patterns:
    - pattern: (org.apache.hc.client5.http.classic.HttpClient $CLIENT).execute(new org.apache.hc.client5.http.classic.methods.HttpGet($URL),
        ...)
    - focus-metavariable: $URL
    requires: REQUEST_INPUT
  - patterns:
    - pattern: (org.apache.hc.client5.http.impl.classic.CloseableHttpClient $CLIENT).execute(new org.apache.hc.client5.http.classic.methods.HttpGet($URL),
        ...)
    - focus-metavariable: $URL
    requires: REQUEST_INPUT
  - patterns:
    - pattern: (org.apache.hc.client5.http.classic.HttpClient $CLIENT).execute(new org.apache.hc.client5.http.classic.methods.HttpPost($URL),
        ...)
    - focus-metavariable: $URL
    requires: REQUEST_INPUT
  - patterns:
    - pattern: (org.apache.hc.client5.http.impl.classic.CloseableHttpClient $CLIENT).execute(new org.apache.hc.client5.http.classic.methods.HttpPost($URL),
        ...)
    - focus-metavariable: $URL
    requires: REQUEST_INPUT
  - patterns:
    - pattern: (org.apache.http.client.HttpClient $CLIENT).execute($REQ, ...)
    - focus-metavariable: $REQ
    requires: HTTP_DESTINATION
  - patterns:
    - pattern: (org.apache.http.impl.client.CloseableHttpClient $CLIENT).execute($REQ, ...)
    - focus-metavariable: $REQ
    requires: HTTP_DESTINATION
  - patterns:
    - pattern: (org.apache.hc.client5.http.classic.HttpClient $CLIENT).execute($REQ, ...)
    - focus-metavariable: $REQ
    requires: HTTP_DESTINATION
  - patterns:
    - pattern: (org.apache.hc.client5.http.impl.classic.CloseableHttpClient $CLIENT).execute($REQ, ...)
    - focus-metavariable: $REQ
    requires: HTTP_DESTINATION
  metadata:
    publisher: AI Security Runtime
    rule_pack: ai-security-core
    rule_version: 1.2.0
    language: java
    confidence: HIGH
    maturity: BETA
    license: Apache-2.0
    category: ssrf
    cwe:
    - CWE-918
    framework: Apache HttpClient 4 / 5 classic
    references: &id001
    - https://cwe.mitre.org/data/definitions/918.html
    - https://hc.apache.org/httpcomponents-client-4.5.x/current/httpclient/apidocs/org/apache/http/client/HttpClient.html
    - https://hc.apache.org/components/httpcomponents-client-5.5.x/5.5.2/httpclient5/apidocs/org/apache/hc/client5/http/classic/methods/HttpGet.html
    - https://hc.apache.org/httpcomponents-client-4.5.x/current/httpclient/apidocs/org/apache/http/client/methods/HttpRequestBase.html
    - https://hc.apache.org/httpcomponents-client-5.6.x/5.6/httpclient5/apidocs/org/apache/hc/client5/http/classic/methods/HttpUriRequestBase.html
    provenance:
      origin: FIRST_PARTY
      author: AI Security Runtime contributors
      created_at: '2026-10-10'
      references: *id001
      license: Apache-2.0
      derived_from: ''
  pattern-propagators:
  - pattern: (org.apache.http.client.methods.HttpGet $REQ).setURI($URL)
    from: $URL
    to: $REQ
    requires: REQUEST_INPUT
    label: HTTP_DESTINATION
    by-side-effect: true
  - pattern: (org.apache.http.client.methods.HttpPost $REQ).setURI($URL)
    from: $URL
    to: $REQ
    requires: REQUEST_INPUT
    label: HTTP_DESTINATION
    by-side-effect: true
  - pattern: (org.apache.hc.client5.http.classic.methods.HttpGet $REQ).setUri($URL)
    from: $URL
    to: $REQ
    requires: REQUEST_INPUT
    label: HTTP_DESTINATION
    by-side-effect: true
  - pattern: (org.apache.hc.client5.http.classic.methods.HttpPost $REQ).setUri($URL)
    from: $URL
    to: $REQ
    requires: REQUEST_INPUT
    label: HTTP_DESTINATION
    by-side-effect: true
  pattern-sanitizers:
  - patterns:
    - pattern: (org.apache.http.client.methods.HttpGet $REQ).setURI(java.net.URI.create($FIXED))
    - metavariable-regex:
        metavariable: $FIXED
        regex: ^"https?://[A-Za-z0-9.-]+(?::[0-9]{1,5})?(?:/[A-Za-z0-9._~/-]*)?"$
    - focus-metavariable: $REQ
    exact: true
    by-side-effect: true
  - patterns:
    - pattern: (org.apache.http.client.methods.HttpGet $REQ).setURI(new java.net.URI($FIXED))
    - metavariable-regex:
        metavariable: $FIXED
        regex: ^"https?://[A-Za-z0-9.-]+(?::[0-9]{1,5})?(?:/[A-Za-z0-9._~/-]*)?"$
    - focus-metavariable: $REQ
    exact: true
    by-side-effect: true
  - patterns:
    - pattern: (org.apache.http.client.methods.HttpPost $REQ).setURI(java.net.URI.create($FIXED))
    - metavariable-regex:
        metavariable: $FIXED
        regex: ^"https?://[A-Za-z0-9.-]+(?::[0-9]{1,5})?(?:/[A-Za-z0-9._~/-]*)?"$
    - focus-metavariable: $REQ
    exact: true
    by-side-effect: true
  - patterns:
    - pattern: (org.apache.http.client.methods.HttpPost $REQ).setURI(new java.net.URI($FIXED))
    - metavariable-regex:
        metavariable: $FIXED
        regex: ^"https?://[A-Za-z0-9.-]+(?::[0-9]{1,5})?(?:/[A-Za-z0-9._~/-]*)?"$
    - focus-metavariable: $REQ
    exact: true
    by-side-effect: true
  - patterns:
    - pattern: (org.apache.hc.client5.http.classic.methods.HttpGet $REQ).setUri(java.net.URI.create($FIXED))
    - metavariable-regex:
        metavariable: $FIXED
        regex: ^"https?://[A-Za-z0-9.-]+(?::[0-9]{1,5})?(?:/[A-Za-z0-9._~/-]*)?"$
    - focus-metavariable: $REQ
    exact: true
    by-side-effect: true
  - patterns:
    - pattern: (org.apache.hc.client5.http.classic.methods.HttpGet $REQ).setUri(new java.net.URI($FIXED))
    - metavariable-regex:
        metavariable: $FIXED
        regex: ^"https?://[A-Za-z0-9.-]+(?::[0-9]{1,5})?(?:/[A-Za-z0-9._~/-]*)?"$
    - focus-metavariable: $REQ
    exact: true
    by-side-effect: true
  - patterns:
    - pattern: (org.apache.hc.client5.http.classic.methods.HttpPost $REQ).setUri(java.net.URI.create($FIXED))
    - metavariable-regex:
        metavariable: $FIXED
        regex: ^"https?://[A-Za-z0-9.-]+(?::[0-9]{1,5})?(?:/[A-Za-z0-9._~/-]*)?"$
    - focus-metavariable: $REQ
    exact: true
    by-side-effect: true
  - patterns:
    - pattern: (org.apache.hc.client5.http.classic.methods.HttpPost $REQ).setUri(new java.net.URI($FIXED))
    - metavariable-regex:
        metavariable: $FIXED
        regex: ^"https?://[A-Za-z0-9.-]+(?::[0-9]{1,5})?(?:/[A-Za-z0-9._~/-]*)?"$
    - focus-metavariable: $REQ

{
  "rules": [
    {
      "id": "ai-security.python.explicit-shell-command",
      "languages": [
        "python"
      ],
      "severity": "ERROR",
      "message": "Untrusted input reaches an explicit shell command argument",
      "mode": "taint",
      "pattern-sources": [
        {
          "pattern": "flask.request.cookies.get(...)",
          "exact": true
        },
        {
          "pattern": "flask.request.cookies[...]",
          "exact": true
        },
        {
          "pattern": "flask.request.headers.get(...)",
          "exact": true
        },
        {
          "pattern": "flask.request.headers[...]",
          "exact": true
        },
        {
          "pattern": "flask.request.args.get(...)",
          "exact": true
        },
        {
          "pattern": "flask.request.args[...]",
          "exact": true
        },
        {
          "pattern": "flask.request.form.get(...)",
          "exact": true
        },
        {
          "pattern": "flask.request.form[...]",
          "exact": true
        },
        {
          "pattern": "flask.request.values.get(...)",
          "exact": true
        },
        {
          "pattern": "flask.request.get_json(...)",
          "exact": true
        },
        {
          "pattern": "flask.request.get_data(...)",
          "exact": true
        },
        {
          "pattern": "input(...)",
          "exact": true
        },
        {
          "patterns": [
            {
              "pattern-inside": "def $F($REQUEST, ...):\n    ..."
            },
            {
              "pattern-either": [
                {
                  "pattern": "$REQUEST.GET.get(...)"
                },
                {
                  "pattern": "$REQUEST.POST.get(...)"
                },
                {
                  "pattern": "$REQUEST.GET[...]"
                },
                {
                  "pattern": "$REQUEST.POST[...]"
                }
              ]
            }
          ],
          "exact": true
        },
        {
          "pattern": "flask.request.args.getlist(...)",
          "exact": true
        },
        {
          "pattern": "flask.request.form.getlist(...)",
          "exact": true
        },
        {
          "pattern": "flask.request.values.getlist(...)",
          "exact": true
        }
      ],
      "pattern-sinks": [
        {
          "patterns": [
            {
              "pattern": "subprocess.$METHOD([$SHELL, $FLAG, $COMMAND, ...], ...)"
            },
            {
              "metavariable-regex": {
                "metavariable": "$SHELL",
                "regex": "^[\\\"\\x27](?:/(?:usr/)?bin/)?(?:sh|bash|dash|ksh|zsh)[\\\"\\x27]$"
              }
            },
            {
              "metavariable-regex": {
                "metavariable": "$FLAG",
                "regex": "^[\\\"\\x27]-c[\\\"\\x27]$"
              }
            },
            {
              "pattern-not": "subprocess.$METHOD([$SHELL, $FLAG, $COMMAND, ...], executable=$OVERRIDE, ...)"
            },
            {
              "pattern-not": "subprocess.$METHOD([$SHELL, $FLAG, $COMMAND, ...], shell=True, ...)"
            },
            {
              "metavariable-regex": {
                "metavariable": "$METHOD",
                "regex": "^(run|call|Popen|check_call|check_output)$"
              }
            },
            {
              "focus-metavariable": "$COMMAND"
            }
          ]
        },
        {
          "patterns": [
            {
              "pattern": "$ARGV = [$SHELL, $FLAG]\n$ARGV.append($COMMAND)\n$PROC = subprocess.$METHOD($ARGV, ...)"
            },
            {
              "metavariable-regex": {
                "metavariable": "$SHELL",
                "regex": "^[\\\"\\x27](?:/(?:usr/)?bin/)?(?:sh|bash|dash|ksh|zsh)[\\\"\\x27]$"
              }
            },
            {
              "metavariable-regex": {
                "metavariable": "$FLAG",
                "regex": "^[\\\"\\x27]-c[\\\"\\x27]$"
              }
            },
            {
              "pattern-not": "$ARGV = [$SHELL, $FLAG]\n$ARGV.append($COMMAND)\n$PROC = subprocess.$METHOD($ARGV, executable=$OVERRIDE, ...)"
            },
            {
              "pattern-not": "$ARGV = [$SHELL, $FLAG]\n$ARGV.append($COMMAND)\n$PROC = subprocess.$METHOD($ARGV, shell=True, ...)"
            },
            {
              "metavariable-regex": {
                "metavariable": "$METHOD",
                "regex": "^(run|call|Popen|check_call|check_output)$"
              }
            },
            {
              "focus-metavariable": "$COMMAND"
            }
          ]
        },
        {
          "patterns": [
            {
              "pattern": "$ARGV = []\n$ARGV.append($SHELL)\n$ARGV.append($FLAG)\n$ARGV.append($COMMAND)\n$PROC = subprocess.$METHOD($ARGV, ...)"
            },
            {
              "metavariable-regex": {
                "metavariable": "$SHELL",
                "regex": "^[\\\"\\x27](?:/(?:usr/)?bin/)?(?:sh|bash|dash|ksh|zsh)[\\\"\\x27]$"
              }
            },
            {
              "metavariable-regex": {
                "metavariable": "$FLAG",
                "regex": "^[\\\"\\x27]-c[\\\"\\x27]$"
              }
            },
            {
              "pattern-not": "$ARGV = []\n$ARGV.append($SHELL)\n$ARGV.append($FLAG)\n$ARGV.append($COMMAND)\n$PROC = subprocess.$METHOD($ARGV, executable=$OVERRIDE, ...)"
            },
            {
              "pattern-not": "$ARGV = []\n$ARGV.append($SHELL)\n$ARGV.append($FLAG)\n$ARGV.append($COMMAND)\n$PROC = subprocess.$METHOD($ARGV, shell=True, ...)"
            },
            {
              "metavariable-regex": {
                "metavariable": "$METHOD",
                "regex": "^(run|call|Popen|check_call|check_output)$"
              }
            },
            {
              "focus-metavariable": "$COMMAND"
            }
          ]
        },
        {
          "patterns": [
            {
              "pattern": "$ARGV = []\nif $PLATFORM:\n    $ARGV.append($OTHER_EXEC)\n    $ARGV.append($OTHER_FLAG)\nelse:\n    $ARGV.append($SHELL)\n    $ARGV.append($FLAG)\n$ARGV.append($COMMAND)\n$PROC = subprocess.$METHOD($ARGV, ...)"
            },
            {
              "metavariable-regex": {
                "metavariable": "$SHELL",
                "regex": "^[\\\"\\x27](?:/(?:usr/)?bin/)?(?:sh|bash|dash|ksh|zsh)[\\\"\\x27]$"
              }
            },
            {
              "metavariable-regex": {
                "metavariable": "$FLAG",
                "regex": "^[\\\"\\x27]-c[\\\"\\x27]$"
              }
            },
            {
              "metavariable-pattern": {
                "metavariable": "$PLATFORM",
                "pattern-either": [
                  {
                    "pattern": "os.name == \"nt\""
                  },
                  {
                    "pattern": "os.name == \"posix\""
                  },
                  {
                    "pattern": "sys.platform == \"win32\""
                  },
                  {
                    "pattern": "sys.platform.startswith(\"win\")"
                  },
                  {
                    "pattern": "\"Windows\" in os.name"
                  }
                ]
              }
            },
            {
              "metavariable-regex": {
                "metavariable": "$OTHER_EXEC",
                "regex": "^[\"'][^\"']*[\"']$"
              }
            },
            {
              "metavariable-regex": {
                "metavariable": "$OTHER_FLAG",
                "regex": "^[\"'][^\"']*[\"']$"
              }
            },
            {
              "pattern-not": "$ARGV = []\nif $PLATFORM:\n    $ARGV.append($OTHER_EXEC)\n    $ARGV.append($OTHER_FLAG)\nelse:\n    $ARGV.append($SHELL)\n    $ARGV.append($FLAG)\n$ARGV.append($COMMAND)\n$PROC = subprocess.$METHOD($ARGV, executable=$OVERRIDE, ...)"
            },
            {
              "pattern-not": "$ARGV = []\nif $PLATFORM:\n    $ARGV.append($OTHER_EXEC)\n    $ARGV.append($OTHER_FLAG)\nelse:\n    $ARGV.append($SHELL)\n    $ARGV.append($FLAG)\n$ARGV.append($COMMAND)\n$PROC = subprocess.$METHOD($ARGV, shell=True, ...)"
            },
            {
              "metavariable-regex": {
                "metavariable": "$METHOD",
                "regex": "^(run|call|Popen|check_call|check_output)$"
              }
            },
            {
              "focus-metavariable": "$COMMAND"
            }
          ]
        },
        {
          "patterns": [
            {
              "pattern": "subprocess.$METHOD([$SHELL, $FLAG, $COMMAND, ...], ...)"
            },
            {
              "metavariable-regex": {
                "metavariable": "$SHELL",
                "regex": "(?i)^[\"']cmd(?:\\.exe)?[\"']$"
              }
            },
            {
              "metavariable-regex": {
                "metavariable": "$FLAG",
                "regex": "(?i)^[\"']/c[\"']$"
              }
            },
            {
              "pattern-not": "subprocess.$METHOD([$SHELL, $FLAG, $COMMAND, ...], executable=$OVERRIDE, ...)"
            },
            {
              "pattern-not": "subprocess.$METHOD([$SHELL, $FLAG, $COMMAND, ...], shell=True, ...)"
            },
            {
              "metavariable-regex": {
                "metavariable": "$METHOD",
                "regex": "^(run|call|Popen|check_call|check_output)$"
              }
            },
            {
              "focus-metavariable": "$COMMAND"
            }
          ]
        },
        {
          "patterns": [
            {
              "pattern": "$ARGV = [$SHELL, $FLAG]\n$ARGV.append($COMMAND)\n$PROC = subprocess.$METHOD($ARGV, ...)"
            },
            {
              "metavariable-regex": {
                "metavariable": "$SHELL",
                "regex": "(?i)^[\"']cmd(?:\\.exe)?[\"']$"
              }
            },
            {
              "metavariable-regex": {
                "metavariable": "$FLAG",
                "regex": "(?i)^[\"']/c[\"']$"
              }
            },
            {
              "pattern-not": "$ARGV = [$SHELL, $FLAG]\n$ARGV.append($COMMAND)\n$PROC = subprocess.$METHOD($ARGV, executable=$OVERRIDE, ...)"
            },
            {
              "pattern-not": "$ARGV = [$SHELL, $FLAG]\n$ARGV.append($COMMAND)\n$PROC = subprocess.$METHOD($ARGV, shell=True, ...)"
            },
            {
              "metavariable-regex": {
                "metavariable": "$METHOD",
                "regex": "^(run|call|Popen|check_call|check_output)$"
              }
            },
            {
              "focus-metavariable": "$COMMAND"
            }
          ]
        },
        {
          "patterns": [
            {
              "pattern": "$ARGV = []\n$ARGV.append($SHELL)\n$ARGV.append($FLAG)\n$ARGV.append($COMMAND)\n$PROC = subprocess.$METHOD($ARGV, ...)"
            },
            {
              "metavariable-regex": {
                "metavariable": "$SHELL",
                "regex": "(?i)^[\"']cmd(?:\\.exe)?[\"']$"
              }
            },
            {
              "metavariable-regex": {
                "metavariable": "$FLAG",
                "regex": "(?i)^[\"']/c[\"']$"
              }
            },
            {
              "pattern-not": "$ARGV = []\n$ARGV.append($SHELL)\n$ARGV.append($FLAG)\n$ARGV.append($COMMAND)\n$PROC = subprocess.$METHOD($ARGV, executable=$OVERRIDE, ...)"
            },
            {
              "pattern-not": "$ARGV = []\n$ARGV.append($SHELL)\n$ARGV.append($FLAG)\n$ARGV.append($COMMAND)\n$PROC = subprocess.$METHOD($ARGV, shell=True, ...)"
            },
            {
              "metavariable-regex": {
                "metavariable": "$METHOD",
                "regex": "^(run|call|Popen|check_call|check_output)$"
              }
            },
            {
              "focus-metavariable": "$COMMAND"
            }
          ]
        }
      ],
      "metadata": {
        "publisher": "AI Security Runtime",
        "rule_pack": "ai-security-core",

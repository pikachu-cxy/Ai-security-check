      },
      "pattern-sanitizers": [
        {
          "pattern": "int(...)",
          "exact": true
        },
        {
          "pattern": "float(...)",
          "exact": true
        }
      ],
      "pattern-propagators": [
        {
          "patterns": [
            {
              "pattern": "$VALUES = []\n$VALUES.append($FIRST)\n$VALUES.append($INPUT)\n$VALUES.append($LAST)\n$VALUES.pop(0)\n$OUT = $VALUES[0]"
            },
            {
              "metavariable-regex": {
                "metavariable": "$FIRST",
                "regex": "^[\"'][^\"']*[\"']$"
              }
            },
            {
              "metavariable-regex": {
                "metavariable": "$LAST",
                "regex": "^[\"'][^\"']*[\"']$"
              }
            },
            {
              "metavariable-regex": {
                "metavariable": "$INPUT",
                "regex": "^[A-Za-z_]\\w*$"
              }
            }
          ],
          "from": "$INPUT",
          "to": "$OUT"
        }

{
  "rules": [
    {
      "id": "ai-security.python.path-traversal",
      "languages": [
        "python"
      ],
      "severity": "ERROR",
      "message": "不可信路径进入文件读取",
      "mode": "taint",
      "pattern-sources": [
        {
          "pattern": "flask.request.args.get(...)",
          "exact": true
        },
        {
          "pattern": "flask.request.args[...]",
          "exact": true
        },
        {
          "pattern": "flask.request.form.get(...)",
          "exact": true
        },
        {
          "pattern": "flask.request.form[...]",
          "exact": true
        },
        {
          "pattern": "flask.request.values.get(...)",
          "exact": true
        },
        {
          "pattern": "flask.request.get_json(...)",
          "exact": true
        },
        {
          "pattern": "flask.request.get_data(...)",
          "exact": true
        },
        {
          "pattern": "input(...)",
          "exact": true
        },
        {
          "patterns": [
            {
              "pattern-inside": "def $F($REQUEST, ...):\n    ..."
            },
            {
              "pattern-either": [
                {
                  "pattern": "$REQUEST.GET.get(...)"
                },
                {
                  "pattern": "$REQUEST.POST.get(...)"
                },
                {
                  "pattern": "$REQUEST.GET[...]"
                },
                {
                  "pattern": "$REQUEST.POST[...]"
                }
              ]
            }
          ],
          "exact": true
        }
      ],
      "pattern-sinks": [
        {
          "patterns": [
            {
              "pattern": "open($PATH, ...)"
            },
            {
              "focus-metavariable": "$PATH"
            }
          ]
        },
        {
          "patterns": [
            {
              "pattern": "flask.send_file($PATH, ...)"
            },
            {
              "focus-metavariable": "$PATH"
            }
          ]
        }
      ],
      "metadata": {
        "publisher": "AI Security Runtime",
        "rule_pack": "ai-security-core",
        "rule_version": "1.3.0",
        "language": "python",
        "category": "path-traversal",
        "cwe": [
          "CWE-22"
        ],
        "confidence": "HIGH",
        "maturity": "BETA",
        "framework": "Flask / Django / Python",
        "license": "Apache-2.0",
        "references": [
          "https://cwe.mitre.org/data/definitions/22.html",
          "https://docs.python.org/3/library/functions.html#open"
        ],
        "provenance": {
          "origin": "FIRST_PARTY",
          "author": "AI Security Runtime contributors",
          "created_at": "2026-10-10",
          "references": [
            "https://cwe.mitre.org/data/definitions/22.html",
            "https://docs.python.org/3/library/functions.html#open"
          ],
          "license": "Apache-2.0",
          "derived_from": ""
        }
      }
    }
  ]
}

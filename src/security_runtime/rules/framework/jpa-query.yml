rules:
- id: ai-security.java.jpa-query
  languages:
  - java
  severity: ERROR
  message: Externally influenced query text bypasses value binding; use a fixed query template and bind values.
  mode: taint
  pattern-sources:
  - pattern: (javax.servlet.http.HttpServletRequest $REQUEST).getParameter(...)
    exact: true
  - pattern: (javax.servlet.http.HttpServletRequest $REQUEST).getHeader(...)
    exact: true
  - pattern: (javax.servlet.http.HttpServletRequest $REQUEST).getInputStream(...)
    exact: true
  - pattern: (javax.servlet.http.HttpServletRequest $REQUEST).getReader(...)
    exact: true
  - pattern: (jakarta.servlet.http.HttpServletRequest $REQUEST).getParameter(...)
    exact: true
  - pattern: (jakarta.servlet.http.HttpServletRequest $REQUEST).getHeader(...)
    exact: true
  - pattern: (jakarta.servlet.http.HttpServletRequest $REQUEST).getInputStream(...)
    exact: true
  - pattern: (jakarta.servlet.http.HttpServletRequest $REQUEST).getReader(...)
    exact: true
  - patterns:
    - pattern-inside: $RETURN $METHOD(..., @org.springframework.web.bind.annotation.RequestParam $TYPE $INPUT, ...)
        { ... }
    - focus-metavariable: $INPUT
    exact: true
  - patterns:
    - pattern-inside: $RETURN $METHOD(..., @org.springframework.web.bind.annotation.RequestParam(...) $TYPE $INPUT,
        ...) { ... }
    - focus-metavariable: $INPUT
    exact: true
  - patterns:
    - pattern-inside: $RETURN $METHOD(..., @org.springframework.web.bind.annotation.RequestBody $TYPE $INPUT, ...)
        { ... }
    - focus-metavariable: $INPUT
    exact: true
  - patterns:
    - pattern-inside: $RETURN $METHOD(..., @org.springframework.web.bind.annotation.RequestBody(...) $TYPE $INPUT,
        ...) { ... }
    - focus-metavariable: $INPUT
    exact: true
  - patterns:
    - pattern-inside: $RETURN $METHOD(..., @org.springframework.web.bind.annotation.PathVariable $TYPE $INPUT, ...)
        { ... }
    - focus-metavariable: $INPUT
    exact: true
  - patterns:
    - pattern-inside: $RETURN $METHOD(..., @org.springframework.web.bind.annotation.PathVariable(...) $TYPE $INPUT,
        ...) { ... }
    - focus-metavariable: $INPUT
    exact: true
  pattern-sinks:
  - patterns:
    - pattern: (javax.persistence.EntityManager $DB).$METHOD($SQL, ...)
    - metavariable-regex:
        metavariable: $METHOD
        regex: ^(createQuery|createNativeQuery)$
    - focus-metavariable: $SQL
  - patterns:
    - pattern: (jakarta.persistence.EntityManager $DB).$METHOD($SQL, ...)
    - metavariable-regex:
        metavariable: $METHOD
        regex: ^(createQuery|createNativeQuery)$
    - focus-metavariable: $SQL
  - patterns:
    - pattern: (org.hibernate.Session $DB).$METHOD($SQL, ...)
    - metavariable-regex:
        metavariable: $METHOD
        regex: ^(createQuery|createNativeQuery|createSQLQuery|createSelectionQuery|createMutationQuery|createNativeMutationQuery)$
    - focus-metavariable: $SQL
  metadata:
    publisher: AI Security Runtime
    rule_pack: ai-security-core
    rule_version: 1.2.0
    language: java
    confidence: HIGH
    maturity: BETA
    license: Apache-2.0
    category: sql-injection
    cwe:
    - CWE-89
    framework: JPA / Hibernate
    references: &id001
    - https://cwe.mitre.org/data/definitions/89.html
    - https://jakarta.ee/specifications/persistence/3.2/apidocs/jakarta.persistence/jakarta/persistence/entitymanager
    - https://docs.jboss.org/hibernate/orm/6.1/javadocs/org/hibernate/Session.html
    provenance:
      origin: FIRST_PARTY
      author: AI Security Runtime contributors
      created_at: '2026-10-10'
      references: *id001
      license: Apache-2.0
      derived_from: ''

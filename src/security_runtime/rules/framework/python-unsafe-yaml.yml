{
  "rules": [
    {
      "id": "ai-security.python.unsafe-yaml",
      "languages": [
        "python"
      ],
      "severity": "ERROR",
      "message": "YAML 使用可构造任意对象的加载器",
      "pattern-either": [
        {
          "pattern": "yaml.load(..., Loader=yaml.Loader, ...)"
        },
        {
          "pattern": "yaml.load(..., Loader=yaml.UnsafeLoader, ...)"
        },
        {
          "pattern": "yaml.unsafe_load(...)"
        }
      ],
      "metadata": {
        "publisher": "AI Security Runtime",
        "rule_pack": "ai-security-core",
        "rule_version": "1.3.0",
        "language": "python",
        "category": "unsafe-deserialization",
        "cwe": [
          "CWE-502"
        ],
        "confidence": "HIGH",
        "maturity": "BETA",
        "framework": "PyYAML",
        "license": "Apache-2.0",
        "references": [
          "https://cwe.mitre.org/data/definitions/502.html",
          "https://pyyaml.org/wiki/PyYAMLDocumentation"
        ],
        "provenance": {
          "origin": "FIRST_PARTY",
          "author": "AI Security Runtime contributors",
          "created_at": "2026-10-10",
          "references": [
            "https://cwe.mitre.org/data/definitions/502.html",
            "https://pyyaml.org/wiki/PyYAMLDocumentation"
          ],
          "license": "Apache-2.0",
          "derived_from": ""
        }
      }
    }
  ]
}

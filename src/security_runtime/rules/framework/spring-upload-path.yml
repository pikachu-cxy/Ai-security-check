rules:
- id: ai-security.java.spring-upload-path
  languages:
  - java
  severity: ERROR
  message: Client-controlled upload filename reaches a filesystem destination; use a server-selected filename and
    verify directory containment.
  mode: taint
  pattern-sources:
  - pattern: (javax.servlet.http.HttpServletRequest $REQUEST).getParameter(...)
    exact: true
  - pattern: (javax.servlet.http.HttpServletRequest $REQUEST).getHeader(...)
    exact: true
  - pattern: (javax.servlet.http.HttpServletRequest $REQUEST).getInputStream(...)
    exact: true
  - pattern: (javax.servlet.http.HttpServletRequest $REQUEST).getReader(...)
    exact: true
  - pattern: (jakarta.servlet.http.HttpServletRequest $REQUEST).getParameter(...)
    exact: true
  - pattern: (jakarta.servlet.http.HttpServletRequest $REQUEST).getHeader(...)
    exact: true
  - pattern: (jakarta.servlet.http.HttpServletRequest $REQUEST).getInputStream(...)
    exact: true
  - pattern: (jakarta.servlet.http.HttpServletRequest $REQUEST).getReader(...)
    exact: true
  - patterns:
    - pattern-inside: $RETURN $METHOD(..., @org.springframework.web.bind.annotation.RequestParam $TYPE $INPUT, ...)
        { ... }
    - focus-metavariable: $INPUT
    exact: true
  - patterns:
    - pattern-inside: $RETURN $METHOD(..., @org.springframework.web.bind.annotation.RequestParam(...) $TYPE $INPUT,
        ...) { ... }
    - focus-metavariable: $INPUT
    exact: true
  - patterns:
    - pattern-inside: $RETURN $METHOD(..., @org.springframework.web.bind.annotation.RequestBody $TYPE $INPUT, ...)
        { ... }
    - focus-metavariable: $INPUT
    exact: true
  - patterns:
    - pattern-inside: $RETURN $METHOD(..., @org.springframework.web.bind.annotation.RequestBody(...) $TYPE $INPUT,
        ...) { ... }
    - focus-metavariable: $INPUT
    exact: true
  - patterns:
    - pattern-inside: $RETURN $METHOD(..., @org.springframework.web.bind.annotation.PathVariable $TYPE $INPUT, ...)
        { ... }
    - focus-metavariable: $INPUT
    exact: true
  - patterns:
    - pattern-inside: $RETURN $METHOD(..., @org.springframework.web.bind.annotation.PathVariable(...) $TYPE $INPUT,
        ...) { ... }
    - focus-metavariable: $INPUT
    exact: true
  - pattern: (org.springframework.web.multipart.MultipartFile $UPLOAD).getOriginalFilename()
    exact: true
  pattern-sinks:
  - patterns:
    - pattern: (org.springframework.web.multipart.MultipartFile $UPLOAD).transferTo($PATH)
    - focus-metavariable: $PATH
  metadata:
    publisher: AI Security Runtime
    rule_pack: ai-security-core
    rule_version: 1.2.0
    language: java
    confidence: HIGH
    maturity: BETA
    license: Apache-2.0
    category: arbitrary-file-write
    cwe:
    - CWE-73
    framework: Spring MultipartFile
    references: &id001
    - https://cwe.mitre.org/data/definitions/73.html
    - https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/web/multipart/MultipartFile.html
    provenance:
      origin: FIRST_PARTY
      author: AI Security Runtime contributors
      created_at: '2026-10-10'
      references: *id001
      license: Apache-2.0
      derived_from: ''
  pattern-sanitizers:
  - patterns:
    - pattern-inside: "$RET $METHOD(...) {\n ...\n Path $BASE = Paths.get(\"...\").toAbsolutePath().normalize();\n\
        \ ...\n Path $P = $BASE.resolve($INPUT).normalize();\n ...\n if (!$P.startsWith($BASE)) { throw $EX; }\n\
        \ ...\n}"
    - pattern-not-inside: "try {\n ...\n if (!$P.startsWith($BASE)) { throw $EX; }\n ...\n} catch ($TYPE $CAUGHT)\
        \ { ... }"
    - pattern: if (!$P.startsWith($BASE)) { throw $EX; }
    - focus-metavariable: $P
    exact: true
    by-side-effect: true

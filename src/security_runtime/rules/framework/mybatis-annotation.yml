rules:
- id: ai-security.java.mybatis-annotation
  languages:
  - java
  severity: ERROR
  message: 动态 SQL 可能绕过参数绑定，请检查输入来源和 SQL 构造。
  patterns:
  - pattern-either:
    - pattern: '@org.apache.ibatis.annotations.Select($SQL)

        $RET $METHOD(...);'
    - pattern: '@org.apache.ibatis.annotations.Update($SQL)

        $RET $METHOD(...);'
    - pattern: '@org.apache.ibatis.annotations.Delete($SQL)

        $RET $METHOD(...);'
    - pattern: '@org.apache.ibatis.annotations.Insert($SQL)

        $RET $METHOD(...);'
  - metavariable-regex:
      metavariable: $SQL
      regex: .*\$\{[^}]+\}.*
  metadata:
    publisher: AI Security Runtime
    rule_pack: ai-security-core
    rule_version: 1.1.0
    language: java
    category: sql-injection
    cwe:
    - CWE-89
    confidence: HIGH
    maturity: BETA
    framework: MyBatis
    license: Apache-2.0
    references: &id001
    - https://cwe.mitre.org/data/definitions/89.html
    - https://mybatis.org/mybatis-3/sqlmap-xml.html
    provenance:
      origin: FIRST_PARTY
      author: AI Security Runtime contributors
      created_at: '2026-10-01'
      references: *id001
      license: Apache-2.0
      derived_from: ''

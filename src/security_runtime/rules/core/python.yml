rules:
- id: ai-security.python.command-injection
  languages:
  - python
  severity: ERROR
  message: A shell command is built from program input
  pattern-either:
  - pattern: os.system(...)
  - pattern: subprocess.run(..., shell=True, ...)
  - pattern: subprocess.call(..., shell=True, ...)
  - pattern: subprocess.Popen(..., shell=True, ...)
  metadata:
    publisher: AI Security Runtime
    rule_pack: ai-security-core
    rule_version: 1.1.0
    confidence: MEDIUM
    license: Apache-2.0
    references:
    - https://cwe.mitre.org/data/definitions/78.html
    provenance:
      origin: FIRST_PARTY
      author: AI Security Runtime contributors
      created_at: '2026-09-29'
      references:
      - https://cwe.mitre.org/data/definitions/78.html
      license: Apache-2.0
      derived_from: ''
    language: python
    category: command-injection
    cwe:
    - CWE-78
    maturity: BETA
    framework: Python
- id: ai-security.python.unsafe-eval
  languages:
  - python
  severity: ERROR
  message: Dynamic expression evaluation can execute untrusted code
  pattern: eval(...)
  metadata:
    publisher: AI Security Runtime
    rule_pack: ai-security-core

rules:
- id: ai-security.python.command-injection
  languages:
  - python
  severity: ERROR
  message: A shell command is built from program input
  metadata:
    publisher: AI Security Runtime
    rule_pack: ai-security-core
    rule_version: 1.2.0
    confidence: MEDIUM
    license: Apache-2.0
    references:
    - https://cwe.mitre.org/data/definitions/78.html
    provenance:
      origin: FIRST_PARTY
      author: AI Security Runtime contributors
      created_at: '2026-09-29'
      references:
      - https://cwe.mitre.org/data/definitions/78.html
      license: Apache-2.0
      derived_from: ''
    language: python
    category: command-injection
    cwe:
    - CWE-78
    maturity: BETA
    framework: Python
  patterns:
  - pattern-either:
    - pattern: os.system(...)
    - pattern: subprocess.run(..., shell=True, ...)
    - pattern: subprocess.call(..., shell=True, ...)
    - pattern: subprocess.Popen(..., shell=True, ...)
  - pattern-not: os.system("...")
  - pattern-not: subprocess.run("...", shell=True, ...)
  - pattern-not: subprocess.call("...", shell=True, ...)
  - pattern-not: subprocess.Popen("...", shell=True, ...)
- id: ai-security.python.unsafe-eval
  languages:
  - python
  severity: ERROR
  message: Dynamic expression or statement evaluation can execute untrusted code
  metadata:
    publisher: AI Security Runtime
    rule_pack: ai-security-core
    rule_version: 1.3.0
    confidence: MEDIUM
    license: Apache-2.0
    references:
    - https://cwe.mitre.org/data/definitions/95.html
    provenance:
      origin: FIRST_PARTY
      author: AI Security Runtime contributors
      created_at: '2026-09-29'
      references:
      - https://cwe.mitre.org/data/definitions/95.html
      license: Apache-2.0
      derived_from: ''
    language: python
    category: code-injection
    cwe:
    - CWE-94
    - CWE-95
    maturity: BETA
    framework: Python
  patterns:
  - pattern-either:
    - pattern: eval(...)
    - pattern: exec(...)
  - pattern-not: eval("...", ...)
  - pattern-not: exec("...", ...)

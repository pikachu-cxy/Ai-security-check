rules:
- id: ai-security.java.trust-all-hostname
  languages:
  - java
  severity: ERROR
  message: TLS 校验被无条件接受，连接可能遭到中间人攻击。
  pattern-either:
  - patterns:
    - pattern-inside: class $CLASS implements javax.net.ssl.HostnameVerifier { ...
        }
    - pattern: public boolean verify(String $HOST, javax.net.ssl.SSLSession $SESSION)
        { return true; }
  - pattern: javax.net.ssl.HostnameVerifier $VERIFIER = ($HOST, $SESSION) -> true;
  - pattern: $CONNECTION.setHostnameVerifier(($HOST, $SESSION) -> true);
  - pattern: new javax.net.ssl.HostnameVerifier() { ... public boolean verify(String
      $HOST, javax.net.ssl.SSLSession $SESSION) { return true; } ... }
  metadata:
    publisher: AI Security Runtime
    rule_pack: ai-security-core
    rule_version: 1.1.0
    language: java
    category: trust-all-tls
    cwe:
    - CWE-295
    confidence: HIGH
    maturity: BETA
    framework: JDK
    license: Apache-2.0
    references: &id001
    - https://cwe.mitre.org/data/definitions/295.html
    provenance:
      origin: FIRST_PARTY
      author: AI Security Runtime contributors
      created_at: '2026-10-01'
      references: *id001
      license: Apache-2.0
      derived_from: ''

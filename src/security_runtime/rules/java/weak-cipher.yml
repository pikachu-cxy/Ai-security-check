rules:
- id: ai-security.java.weak-cipher
  languages:
  - java
  severity: WARNING
  message: 使用弱密码算法，需审查实际用途；普通校验不等同于已确认的安全漏洞。
  patterns:
  - pattern: javax.crypto.Cipher.getInstance($ALGORITHM)
  - metavariable-regex:
      metavariable: $ALGORITHM
      regex: (?i)^"(?:DES(?:/[^"\n]*)?|DESede(?:/[^"\n]*)?|RC4|ARCFOUR|AES/ECB/[^"\n]*)"$
  metadata:
    publisher: AI Security Runtime
    rule_pack: ai-security-core
    rule_version: 1.1.0
    language: java
    category: weak-cryptography
    cwe:
    - CWE-327
    confidence: MEDIUM
    maturity: BETA
    framework: JDK
    license: Apache-2.0
    references: &id001
    - https://cwe.mitre.org/data/definitions/327.html
    provenance:
      origin: FIRST_PARTY
      author: AI Security Runtime contributors
      created_at: '2026-10-01'
      references: *id001
      license: Apache-2.0
      derived_from: ''

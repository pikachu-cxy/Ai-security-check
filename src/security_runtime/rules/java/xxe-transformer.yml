rules:
- id: ai-security.java.xxe-transformer
  languages:
  - java
  severity: ERROR
  message: 'xxe risk: review the declared source, sink and local dataflow.'
  mode: taint
  pattern-sources:
  - pattern: (javax.servlet.http.HttpServletRequest $REQUEST).getParameter(...)
    exact: true
  - pattern: (javax.servlet.http.HttpServletRequest $REQUEST).getHeader(...)
    exact: true
  - pattern: (javax.servlet.http.HttpServletRequest $REQUEST).getInputStream(...)
    exact: true
  - pattern: (javax.servlet.http.HttpServletRequest $REQUEST).getReader(...)
    exact: true
  - pattern: (jakarta.servlet.http.HttpServletRequest $REQUEST).getParameter(...)
    exact: true
  - pattern: (jakarta.servlet.http.HttpServletRequest $REQUEST).getHeader(...)
    exact: true
  - pattern: (jakarta.servlet.http.HttpServletRequest $REQUEST).getInputStream(...)
    exact: true
  - pattern: (jakarta.servlet.http.HttpServletRequest $REQUEST).getReader(...)
    exact: true
  - patterns:
    - pattern-inside: $RETURN $METHOD(..., @org.springframework.web.bind.annotation.RequestParam
        $TYPE $INPUT, ...) { ... }
    - focus-metavariable: $INPUT
    exact: true
  - patterns:
    - pattern-inside: $RETURN $METHOD(..., @org.springframework.web.bind.annotation.RequestParam(...)
        $TYPE $INPUT, ...) { ... }
    - focus-metavariable: $INPUT
    exact: true
  - patterns:
    - pattern-inside: $RETURN $METHOD(..., @org.springframework.web.bind.annotation.RequestBody
        $TYPE $INPUT, ...) { ... }
    - focus-metavariable: $INPUT
    exact: true
  - patterns:
    - pattern-inside: $RETURN $METHOD(..., @org.springframework.web.bind.annotation.RequestBody(...)
        $TYPE $INPUT, ...) { ... }
    - focus-metavariable: $INPUT
    exact: true
  - patterns:
    - pattern-inside: $RETURN $METHOD(..., @org.springframework.web.bind.annotation.PathVariable
        $TYPE $INPUT, ...) { ... }
    - focus-metavariable: $INPUT
    exact: true
  - patterns:
    - pattern-inside: $RETURN $METHOD(..., @org.springframework.web.bind.annotation.PathVariable(...)
        $TYPE $INPUT, ...) { ... }
    - focus-metavariable: $INPUT
    exact: true
  pattern-sinks:
  - patterns:
    - pattern-inside: $RET $METHOD(...) { ... TransformerFactory $FACTORY = TransformerFactory.newInstance();
        ... Transformer $TRANSFORMER = $FACTORY.newTransformer(); ... }
    - pattern-not-inside: $RET $METHOD(...) { ... $FACTORY.setAttribute(XMLConstants.ACCESS_EXTERNAL_DTD,
        ""); ... $FACTORY.setAttribute(XMLConstants.ACCESS_EXTERNAL_STYLESHEET, "");
        ... Transformer $TRANSFORMER = $FACTORY.newTransformer(); ... $TRANSFORMER.transform($XML,
        ...); ... }
    - pattern: $TRANSFORMER.transform($XML, ...)
    - focus-metavariable: $XML
  metadata:
    publisher: AI Security Runtime
    rule_pack: ai-security-core
    rule_version: 1.1.0
    language: java
    category: xxe
    cwe:
    - CWE-611
    confidence: HIGH
    maturity: BETA
    framework: JDK
    license: Apache-2.0
    references: &id001
    - https://cwe.mitre.org/data/definitions/611.html
    provenance:
      origin: FIRST_PARTY
      author: AI Security Runtime contributors
      created_at: '2026-10-07'
      references: *id001
      license: Apache-2.0
      derived_from: ''

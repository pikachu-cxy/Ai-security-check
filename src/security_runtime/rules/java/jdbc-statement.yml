rules:
- id: ai-security.java.jdbc-statement
  languages:
  - java
  severity: ERROR
  message: 动态 SQL 可能绕过参数绑定，请检查输入来源和 SQL 构造。
  mode: taint
  pattern-sources:
  - pattern: (javax.servlet.http.HttpServletRequest $REQUEST).getParameter(...)
    exact: true
  - pattern: (javax.servlet.http.HttpServletRequest $REQUEST).getHeader(...)
    exact: true
  - pattern: (javax.servlet.http.HttpServletRequest $REQUEST).getInputStream(...)
    exact: true
  - pattern: (javax.servlet.http.HttpServletRequest $REQUEST).getReader(...)
    exact: true
  - pattern: (jakarta.servlet.http.HttpServletRequest $REQUEST).getParameter(...)
    exact: true
  - pattern: (jakarta.servlet.http.HttpServletRequest $REQUEST).getHeader(...)
    exact: true
  - pattern: (jakarta.servlet.http.HttpServletRequest $REQUEST).getInputStream(...)
    exact: true
  - pattern: (jakarta.servlet.http.HttpServletRequest $REQUEST).getReader(...)
    exact: true
  - patterns:
    - pattern-inside: $RETURN $METHOD(..., @org.springframework.web.bind.annotation.RequestParam
        $TYPE $INPUT, ...) { ... }
    - focus-metavariable: $INPUT
    exact: true
  - patterns:
    - pattern-inside: $RETURN $METHOD(..., @org.springframework.web.bind.annotation.RequestParam(...)
        $TYPE $INPUT, ...) { ... }
    - focus-metavariable: $INPUT
    exact: true
  - patterns:
    - pattern-inside: $RETURN $METHOD(..., @org.springframework.web.bind.annotation.RequestBody
        $TYPE $INPUT, ...) { ... }
    - focus-metavariable: $INPUT
    exact: true
  - patterns:
    - pattern-inside: $RETURN $METHOD(..., @org.springframework.web.bind.annotation.RequestBody(...)
        $TYPE $INPUT, ...) { ... }
    - focus-metavariable: $INPUT
    exact: true
  - patterns:
    - pattern-inside: $RETURN $METHOD(..., @org.springframework.web.bind.annotation.PathVariable
        $TYPE $INPUT, ...) { ... }
    - focus-metavariable: $INPUT
    exact: true
  - patterns:
    - pattern-inside: $RETURN $METHOD(..., @org.springframework.web.bind.annotation.PathVariable(...)
        $TYPE $INPUT, ...) { ... }
    - focus-metavariable: $INPUT
    exact: true
  pattern-sinks:
  # SQL template construction is the boundary; binding a later value does not
  # make an externally selected procedure name safe.
  - patterns:
    # The single-argument API is the proven scope for this phase. Result-set
    # overloads remain unmodelled pending independent precision regressions.
    - pattern: (java.sql.Connection $CONNECTION).prepareCall($SQL)
    - focus-metavariable: $SQL
  - patterns:
    - pattern: (java.sql.Statement $STATEMENT).execute($SQL, ...)
    - focus-metavariable: $SQL
  - patterns:
    - pattern: (java.sql.Statement $STATEMENT).executeQuery($SQL, ...)
    - focus-metavariable: $SQL
  - patterns:
    - pattern: (java.sql.Statement $STATEMENT).executeUpdate($SQL, ...)
    - focus-metavariable: $SQL
  metadata:
    publisher: AI Security Runtime
    rule_pack: ai-security-core
    rule_version: 1.1.0
    language: java
    category: sql-injection
    cwe:
    - CWE-89
    confidence: HIGH
    maturity: BETA
    framework: JDK
    license: Apache-2.0
    references: &id001
    - https://cwe.mitre.org/data/definitions/89.html
    provenance:
      origin: FIRST_PARTY
      author: AI Security Runtime contributors
      created_at: '2026-10-01'
      references: *id001
      license: Apache-2.0
      derived_from: ''

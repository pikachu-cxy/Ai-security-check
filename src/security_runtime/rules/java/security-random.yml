rules:
- id: ai-security.java.security-random
  languages:
  - java
  severity: WARNING
  message: 安全相关变量使用非加密随机数，请检查令牌或验证码生成。
  patterns:
  - pattern-either:
    - pattern: $TYPE $TOKEN = (java.util.Random $RANDOM).nextInt(...);
    - pattern: $TYPE $TOKEN = Math.random();
  - metavariable-regex:
      metavariable: $TOKEN
      regex: (?i)^(?:.*(?:token|nonce|password|session|otp|resetcode|verificationcode).*)$
  metadata:
    publisher: AI Security Runtime
    rule_pack: ai-security-core
    rule_version: 1.1.0
    language: java
    category: insecure-random
    cwe:
    - CWE-330
    confidence: MEDIUM
    maturity: BETA
    framework: JDK
    license: Apache-2.0
    references: &id001
    - https://cwe.mitre.org/data/definitions/330.html
    provenance:
      origin: FIRST_PARTY
      author: AI Security Runtime contributors
      created_at: '2026-10-01'
      references: *id001
      license: Apache-2.0
      derived_from: ''

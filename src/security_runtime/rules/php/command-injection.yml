rules:
- id: ai-security.php.command-injection
  languages:
  - php
  severity: WARNING
  message: Request input reaches a shell command. Avoid building shell commands from
    request data.
  mode: taint
  pattern-sources:
  - pattern: $_GET[...]
    exact: true
  - pattern: $_POST[...]
    exact: true
  - pattern: $_REQUEST[...]
    exact: true
  - pattern: $_COOKIE[...]
    exact: true
  pattern-sinks:
  - patterns:
    - pattern: system($INPUT, ...)
    - focus-metavariable: $INPUT
  - patterns:
    - pattern: exec($INPUT, ...)
    - focus-metavariable: $INPUT
  - patterns:
    - pattern: shell_exec($INPUT)
    - focus-metavariable: $INPUT
  - patterns:
    - pattern: passthru($INPUT, ...)
    - focus-metavariable: $INPUT
  metadata:
    publisher: AI Security Runtime
    rule_pack: ai-security-core
    rule_version: 1.1.0
    language: php
    category: command-injection
    cwe:
    - CWE-78
    confidence: MEDIUM
    maturity: BETA
    framework: PHP superglobals / built-in functions
    license: Apache-2.0
    references: &id001
    - https://cwe.mitre.org/data/definitions/78.html
    provenance:
      origin: FIRST_PARTY
      author: AI Security Runtime contributors
      created_at: '2026-10-22'
      references: *id001
      license: Apache-2.0
      derived_from: ''
  pattern-sanitizers:
  - patterns:
    - pattern-inside: "if (is_numeric($PARTS[0]) && is_numeric($PARTS[1]) && is_numeric($PARTS[2])\
        \ && is_numeric($PARTS[3]) && sizeof($PARTS) == 4) {\n  $TARGET = $PARTS[0]\
        \ . '.' . $PARTS[1] . '.' . $PARTS[2] . '.' . $PARTS[3];\n  ...\n}"
    - pattern: $PARTS[0] . '.' . $PARTS[1] . '.' . $PARTS[2] . '.' . $PARTS[3]
    exact: true

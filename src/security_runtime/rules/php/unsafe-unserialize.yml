rules:
- id: ai-security.php.unsafe-unserialize
  languages:
  - php
  severity: WARNING
  message: Request input is unserialized with object creation enabled. Prefer a non-object
    data format; review all deserialization options.
  mode: taint
  pattern-sources:
  - pattern: $_GET[...]
    exact: true
  - pattern: $_POST[...]
    exact: true
  - pattern: $_REQUEST[...]
    exact: true
  - pattern: $_COOKIE[...]
    exact: true
  pattern-sinks:
  - patterns:
    - pattern: unserialize($INPUT)
    - focus-metavariable: $INPUT
  metadata:
    publisher: AI Security Runtime
    rule_pack: ai-security-core
    rule_version: 1.0.0
    language: php
    category: unsafe-unserialize
    cwe:
    - CWE-502
    confidence: MEDIUM
    maturity: BETA
    framework: PHP superglobals / built-in functions
    license: Apache-2.0
    references: &id001
    - https://cwe.mitre.org/data/definitions/502.html
    provenance:
      origin: FIRST_PARTY
      author: AI Security Runtime contributors
      created_at: '2026-10-22'
      references: *id001
      license: Apache-2.0
      derived_from: ''

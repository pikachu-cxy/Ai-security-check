rules:
- id: ai-security.php.request-include
  languages:
  - php
  severity: WARNING
  message: Request input controls a PHP include path. Select includes from a fixed
    allowlist.
  mode: taint
  pattern-sources:
  - pattern: $_GET[...]
    exact: true
  - pattern: $_POST[...]
    exact: true
  - pattern: $_REQUEST[...]
    exact: true
  - pattern: $_COOKIE[...]
    exact: true
  pattern-sinks:
  - patterns:
    - pattern: include $PATH
    - focus-metavariable: $PATH
  - patterns:
    - pattern: include_once $PATH
    - focus-metavariable: $PATH
  - patterns:
    - pattern: require $PATH
    - focus-metavariable: $PATH
  - patterns:
    - pattern: require_once $PATH
    - focus-metavariable: $PATH
  metadata:
    publisher: AI Security Runtime
    rule_pack: ai-security-core
    rule_version: 1.0.0
    language: php
    category: request-include
    cwe:
    - CWE-98
    confidence: MEDIUM
    maturity: BETA
    framework: PHP superglobals / built-in functions
    license: Apache-2.0
    references: &id001
    - https://cwe.mitre.org/data/definitions/98.html
    provenance:
      origin: FIRST_PARTY
      author: AI Security Runtime contributors
      created_at: '2026-10-22'
      references: *id001
      license: Apache-2.0
      derived_from: ''

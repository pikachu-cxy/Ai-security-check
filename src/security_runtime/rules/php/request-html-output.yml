rules:
- id: ai-security.php.request-html-output
  languages:
  - php
  severity: WARNING
  message: Request input is echoed without HTML escaping. Use context-appropriate
    output encoding; HTML encoding does not protect script or URL contexts.
  mode: taint
  pattern-sources:
  - pattern: $_GET[...]
    exact: true
  - pattern: $_POST[...]
    exact: true
  - pattern: $_REQUEST[...]
    exact: true
  - pattern: $_COOKIE[...]
    exact: true
  pattern-sinks:
  - patterns:
    - pattern: echo $INPUT;
    - focus-metavariable: $INPUT
  pattern-sanitizers:
  - pattern: htmlspecialchars($INPUT, ENT_QUOTES, "UTF-8")
  - pattern: htmlentities($INPUT, ENT_QUOTES, "UTF-8")
  metadata:
    publisher: AI Security Runtime
    rule_pack: ai-security-core
    rule_version: 1.0.0
    language: php
    category: request-html-output
    cwe:
    - CWE-79
    confidence: MEDIUM
    maturity: BETA
    framework: PHP HTML response
    license: Apache-2.0
    references: &id001
    - https://cwe.mitre.org/data/definitions/79.html
    provenance:
      origin: FIRST_PARTY
      author: AI Security Runtime contributors
      created_at: '2026-10-22'
      references: *id001
      license: Apache-2.0
      derived_from: ''

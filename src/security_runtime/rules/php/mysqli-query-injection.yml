rules:
- id: ai-security.php.mysqli-query-injection
  languages:
  - php
  severity: WARNING
  message: Request input reaches raw SQL. Use prepared statements and bound parameters.
  mode: taint
  pattern-sources:
  - pattern: $_GET[...]
    exact: true
  - pattern: $_POST[...]
    exact: true
  - pattern: $_REQUEST[...]
    exact: true
  - pattern: $_COOKIE[...]
    exact: true
  pattern-sinks:
  - patterns:
    - pattern: mysqli_query($CONN, $SQL, ...)
    - focus-metavariable: $SQL
  metadata:
    publisher: AI Security Runtime
    rule_pack: ai-security-core
    rule_version: 1.0.0
    language: php
    category: mysqli-query-injection
    cwe:
    - CWE-89
    confidence: MEDIUM
    maturity: BETA
    framework: PHP superglobals / built-in functions
    license: Apache-2.0
    references: &id001
    - https://cwe.mitre.org/data/definitions/89.html
    provenance:
      origin: FIRST_PARTY
      author: AI Security Runtime contributors
      created_at: '2026-10-22'
      references: *id001
      license: Apache-2.0
      derived_from: ''
